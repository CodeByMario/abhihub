<!-- _file_drop_zone.html - Reusable file drop zone component -->
<!-- Parameters:
     - title: Main title (default: "Open File")
     - message: Subtitle message
     - accepted_types: File input accept attribute (default: "image/*,.pdf")
     - show_browse_button: Whether to show browse button (default: true)
     - max_files: Maximum number of files (default: multiple)
     - zone_id: Unique ID for the drop zone (default: "dropZone")
     - input_id: Unique ID for file input (default: "fileInput")
     - list_id: Unique ID for file list (default: "fileList")
-->

<div class="file-receiver-container">
    <div class="file-receiver-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
            </path>
        </svg>
    </div>

    <h1 class="file-receiver-title">{{ title or "Open File" }}</h1>

    <p class="file-receiver-message">
        {{ message or "Files opened with AbhiHub will appear here. You can also drag and drop files or browse from your device." }}
    </p>

    <div class="file-drop-zone" id="{{ zone_id or 'dropZone' }}">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.5"
            style="margin-bottom: 1rem;">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
            </path>
        </svg>
        <p>Drag and drop files here</p>
        <p style="font-size: 0.9rem; margin-top: 0.5rem;">Supports images and PDFs</p>
        <input type="file" id="{{ input_id or 'fileInput' }}" class="file-input" accept="{{ accepted_types or 'image/*,.pdf' }}" {% if not max_files %}multiple{% endif %}>
        {% if show_browse_button %}
        <button class="browse-btn" onclick="document.getElementById('{{ input_id or 'fileInput' }}').click()">Browse Files</button>
        {% endif %}
    </div>

    <div class="file-list" id="{{ list_id or 'fileList' }}"></div>
</div>

<script>
    const dropZone_{{ zone_id or 'dropZone' }} = document.getElementById('{{ zone_id or 'dropZone' }}');
    const fileInput_{{ input_id or 'fileInput' }} = document.getElementById('{{ input_id or 'fileInput' }}');
    const fileList_{{ list_id or 'fileList' }} = document.getElementById('{{ list_id or 'fileList' }}');

    // Handle drag events
    dropZone_{{ zone_id or 'dropZone' }}.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone_{{ zone_id or 'dropZone' }}.classList.add('dragover');
    });

    dropZone_{{ zone_id or 'dropZone' }}.addEventListener('dragleave', () => {
        dropZone_{{ zone_id or 'dropZone' }}.classList.remove('dragover');
    });

    dropZone_{{ zone_id or 'dropZone' }}.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone_{{ zone_id or 'dropZone' }}.classList.remove('dragover');
        handleFiles_{{ zone_id or 'dropZone' }}(e.dataTransfer.files);
    });

    // Handle file input change
    fileInput_{{ input_id or 'fileInput' }}.addEventListener('change', (e) => {
        handleFiles_{{ zone_id or 'dropZone' }}(e.target.files);
    });

    // Handle files from Launch Handler API
    if ('launchQueue' in window) {
        window.launchQueue.setConsumer(async (launchParams) => {
            if (launchParams.files && launchParams.files.length > 0) {
                const files = [];
                for (const handle of launchParams.files) {
                    const file = await handle.getFile();
                    files.push(file);
                }
                handleFiles_{{ zone_id or 'dropZone' }}(files);
            }
        });
    }

    function handleFiles_{{ zone_id or 'dropZone' }}(files) {
        const allowedTypes = ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/svg+xml', 'application/pdf'];

        Array.from(files).forEach(file => {
            if (!allowedTypes.includes(file.type) && !file.name.toLowerCase().endsWith('.pdf')) {
                alert(`File type not supported: ${file.name}`);
                return;
            }

            displayFile_{{ zone_id or 'dropZone' }}(file);
        });
    }

    function displayFile_{{ zone_id or 'dropZone' }}(file) {
        const item = document.createElement('div');
        item.className = 'file-item';

        const icon = file.type.startsWith('image/') ? '🖼️' : '📄';
        const sizeKB = (file.size / 1024).toFixed(1);
        const size = sizeKB > 1024 ? `${(sizeKB / 1024).toFixed(1)} MB` : `${sizeKB} KB`;

        item.innerHTML = `
      <div class="file-item-icon">${icon}</div>
      <div class="file-item-info">
        <div class="file-item-name">${file.name}</div>
        <div class="file-item-size">${size}</div>
      </div>
    `;

        fileList_{{ list_id or 'fileList' }}.appendChild(item);

        // Create preview for images
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.style.maxWidth = '100%';
                img.style.borderRadius = '8px';
                img.style.marginTop = '1rem';
                fileList_{{ list_id or 'fileList' }}.appendChild(img);
            };
            reader.readAsDataURL(file);
        }
    }
</script>
