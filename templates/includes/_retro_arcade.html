<style>
  :root {
    --phone-body: #1e293b;
    --phone-border: #334155;
    --phone-accent: #38bdf8;
    --lcd-bg: #9bbc0f;
    --lcd-dark: #0f380f;
    --lcd-pixel: #306230;
    --key-bg: #0f172a;
    --key-text: #e2e8f0;
    --key-border: #475569;
  }

  .retro-arcade-wrap {
    width: 100%;
    max-width: 420px;
    margin: 1.5rem auto 2rem;
    padding: 0 0.5rem;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .retro-top-nav {
    width: 100%;
    display: flex;
    justify-content: {% if show_game_back_btn %}space-between{% else %}center{% endif %};
    align-items: center;
    margin-bottom: 0.85rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .nav-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--text-secondary, #94a3b8);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    background: rgba(0, 0, 0, 0.05);
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--border-light, rgba(0, 0, 0, 0.1));
  }
  [data-theme="dark"] .nav-back-btn {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.1);
  }

  .game-mode-pills {
    display: flex;
    gap: 0.4rem;
  }

  .mode-pill {
    background: rgba(0, 0, 0, 0.06);
    border: 1px solid rgba(0, 0, 0, 0.12);
    color: var(--text-secondary, #475569);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.35rem 0.8rem;
    border-radius: 980px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: all 0.2s ease;
  }
  [data-theme="dark"] .mode-pill {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.15);
    color: #cbd5e1;
  }

  .mode-pill.active {
    background: #0071E3;
    color: #ffffff;
    border-color: #0071E3;
    box-shadow: 0 2px 8px rgba(0, 113, 227, 0.35);
  }

  /* THE KEYPAD PHONE CASING */
  .phone-chassis {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(165deg, #334155 0%, #1e293b 50%, #0f172a 100%);
    border-radius: 40px;
    padding: 1.15rem 1rem 1.35rem;
    border: 3.5px solid #475569;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.2),
                inset 0 -4px 6px rgba(0, 0, 0, 0.5);
    position: relative;
  }

  .phone-earpiece {
    width: 46px;
    height: 4px;
    background: #0f172a;
    border-radius: 99px;
    margin: 0 auto 0.4rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }

  .phone-brand {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 900;
    letter-spacing: 0.25em;
    color: #cbd5e1;
    margin-bottom: 0.65rem;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }

  /* LCD Screen Bezel */
  .screen-bezel {
    background: #0f172a;
    border-radius: 16px;
    padding: 0.55rem;
    border: 2px solid #334155;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.8);
    margin-bottom: 1.15rem;
  }

  /* Authentic Green LCD Screen */
  .lcd-display {
    background: var(--lcd-bg);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    border: 2px solid #8bac0f;
  }

  .lcd-header {
    background: #8bac0f;
    color: var(--lcd-dark);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.25rem 0.5rem;
    font-size: 0.72rem;
    font-weight: 900;
    border-bottom: 1px solid #306230;
  }

  #lcdCanvas {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--lcd-bg);
    image-rendering: pixelated;
  }

  .lcd-overlay {
    position: absolute;
    inset: 0;
    background: rgba(155, 188, 15, 0.94);
    color: var(--lcd-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
    font-weight: 900;
  }

  .lcd-overlay.hidden {
    display: none;
  }

  .lcd-overlay h3 {
    margin: 0 0 0.35rem;
    font-size: 1.15rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .lcd-overlay p {
    font-size: 0.72rem;
    margin: 0 0 0.75rem;
    line-height: 1.3;
  }

  .lcd-btn {
    background: var(--lcd-dark);
    color: var(--lcd-bg);
    border: none;
    padding: 0.4rem 1rem;
    border-radius: 4px;
    font-family: inherit;
    font-weight: 900;
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 2px 0 #000;
  }

  .lcd-btn:active {
    transform: translateY(1px);
    box-shadow: none;
  }

  /* Keypad Section */
  .keypad-section {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .nav-controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }

  .softkey-col {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    flex: 1;
  }

  .btn-soft {
    background: linear-gradient(180deg, #334155, #1e293b);
    border: 1.5px solid #475569;
    border-radius: 12px;
    color: #e2e8f0;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 0.5rem 0.25rem;
    cursor: pointer;
    box-shadow: 0 2px 0 #0f172a;
    transition: transform 0.05s;
    touch-action: manipulation;
  }

  .btn-soft:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 #0f172a;
    background: #1e293b;
  }

  .btn-call {
    color: #4ade80;
    font-size: 0.95rem;
  }

  .btn-end {
    color: #f87171;
    font-size: 0.95rem;
    font-weight: 900;
  }

  /* Center D-Pad */
  .dpad-cluster {
    width: 104px;
    height: 104px;
    background: #0f172a;
    border-radius: 50%;
    border: 2px solid #334155;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 4px;
    gap: 2px;
  }

  .dpad-arrow {
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 6px;
    color: #94a3b8;
    font-size: 0.7rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }

  .dpad-arrow:active {
    background: #38bdf8;
    color: #0f172a;
  }

  .dpad-center {
    background: #0284c7;
    color: #ffffff;
    border-color: #38bdf8;
    border-radius: 50%;
    font-size: 0.68rem;
  }

  .dpad-center:active {
    background: #0369a1;
  }

  /* Numeric Keypad */
  .numeric-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.45rem;
  }

  .key-num {
    background: linear-gradient(180deg, #1e293b, #0f172a);
    border: 1.5px solid #334155;
    border-radius: 12px;
    padding: 0.45rem 0.25rem;
    color: #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 #020617;
    touch-action: manipulation;
  }

  .key-num:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #020617;
    background: #334155;
  }

  .key-main {
    font-size: 1.1rem;
    font-weight: 900;
    line-height: 1;
  }

  .key-sub {
    font-size: 0.52rem;
    color: #94a3b8;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  .keyboard-guide {
    text-align: center;
    font-size: 0.73rem;
    color: var(--text-tertiary, #64748b);
    margin-top: 0.85rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
</style>

<div class="retro-arcade-wrap">
  <!-- Top Switcher -->
  <div class="retro-top-nav">
    {% if show_game_back_btn %}
    <a href="{{ url_for('library.pyq_landing') }}" class="nav-back-btn">
      ← Back
    </a>
    {% endif %}

    <div class="game-mode-pills">
      <button type="button" class="mode-pill active" id="btnModeSnake" onclick="setPhoneGame('snake')">🐍 Snake</button>
      <button type="button" class="mode-pill" id="btnModeBird" onclick="setPhoneGame('bird')">🐦 Flappy Bird</button>
    </div>
  </div>

  <!-- THE RETRO NOKIA PHONE -->
  <div class="phone-chassis">
    <div class="phone-earpiece"></div>
    <div class="phone-brand">ABHIHUB 3310</div>

    <!-- LCD Screen -->
    <div class="screen-bezel">
      <div class="lcd-display">
        <div class="lcd-header">
          <span id="lcdGameTitle">SNAKE II</span>
          <span id="lcdScore">000</span>
          <span>🔋 100%</span>
        </div>

        <canvas id="lcdCanvas" width="320" height="240"></canvas>

        <div class="lcd-overlay" id="lcdOverlay">
          <h3 id="lcdOverlayHeading">SNAKE II</h3>
          <p id="lcdOverlayText">Use D-Pad or Keys 2, 4, 6, 8 to steer.</p>
          <button type="button" class="lcd-btn" onclick="startCurrentGame()">START [OK]</button>
        </div>
      </div>
    </div>

    <!-- Phone Keypad -->
    <div class="keypad-section">
      <!-- Softkeys + Nav Cluster -->
      <div class="nav-controls-row">
        <!-- Left Softkeys -->
        <div class="softkey-col">
          <button type="button" class="btn-soft" onclick="pressSoftLeft()">SELECT</button>
          <button type="button" class="btn-soft btn-call" onclick="startCurrentGame()">📞</button>
        </div>

        <!-- D-PAD Navigation -->
        <div class="dpad-cluster">
          <div style="grid-column: 2;">
            <button type="button" class="dpad-arrow" style="width:100%; height:100%;" onclick="phoneAction('UP')">▲</button>
          </div>
          <div style="grid-row: 2; grid-column: 1;">
            <button type="button" class="dpad-arrow" style="width:100%; height:100%;" onclick="phoneAction('LEFT')">◀</button>
          </div>
          <div style="grid-row: 2; grid-column: 2;">
            <button type="button" class="dpad-arrow dpad-center" style="width:100%; height:100%;" onclick="phoneAction('OK')">OK</button>
          </div>
          <div style="grid-row: 2; grid-column: 3;">
            <button type="button" class="dpad-arrow" style="width:100%; height:100%;" onclick="phoneAction('RIGHT')">▶</button>
          </div>
          <div style="grid-row: 3; grid-column: 2;">
            <button type="button" class="dpad-arrow" style="width:100%; height:100%;" onclick="phoneAction('DOWN')">▼</button>
          </div>
        </div>

        <!-- Right Softkeys -->
        <div class="softkey-col">
          <button type="button" class="btn-soft" onclick="pressSoftRight()">PAUSE</button>
          <button type="button" class="btn-soft btn-end" onclick="pressSoftEnd()">✕</button>
        </div>
      </div>

      <!-- 3x4 Classic Nokia Numeric Pad -->
      <div class="numeric-keypad">
        <button type="button" class="key-num" onclick="keyPressSound();">
          <span class="key-main">1</span>
          <span class="key-sub">. , '</span>
        </button>
        <button type="button" class="key-num" onclick="phoneAction('UP')">
          <span class="key-main">2</span>
          <span class="key-sub">▲ ABC</span>
        </button>
        <button type="button" class="key-num" onclick="keyPressSound();">
          <span class="key-main">3</span>
          <span class="key-sub">DEF</span>
        </button>

        <button type="button" class="key-num" onclick="phoneAction('LEFT')">
          <span class="key-main">4</span>
          <span class="key-sub">◀ GHI</span>
        </button>
        <button type="button" class="key-num" onclick="phoneAction('OK')">
          <span class="key-main">5</span>
          <span class="key-sub">● JKL</span>
        </button>
        <button type="button" class="key-num" onclick="phoneAction('RIGHT')">
          <span class="key-main">6</span>
          <span class="key-sub">▶ MNO</span>
        </button>

        <button type="button" class="key-num" onclick="keyPressSound();">
          <span class="key-main">7</span>
          <span class="key-sub">PQRS</span>
        </button>
        <button type="button" class="key-num" onclick="phoneAction('DOWN')">
          <span class="key-main">8</span>
          <span class="key-sub">▼ TUV</span>
        </button>
        <button type="button" class="key-num" onclick="keyPressSound();">
          <span class="key-main">9</span>
          <span class="key-sub">WXYZ</span>
        </button>

        <button type="button" class="key-num" onclick="keyPressSound();">
          <span class="key-main">*</span>
          <span class="key-sub">+</span>
        </button>
        <button type="button" class="key-num" onclick="phoneAction('DOWN')">
          <span class="key-main">0</span>
          <span class="key-sub">_</span>
        </button>
        <button type="button" class="key-num" onclick="phoneAction('OK')">
          <span class="key-main">#</span>
          <span class="key-sub">⇧</span>
        </button>
      </div>
    </div>
  </div>

  <div class="keyboard-guide">
    💻 Controls: Arrow Keys or 2/4/6/8 • Space / OK to Flap / Start
  </div>
</div>

<script>
  (function () {
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playBeep(freq, duration = 0.05) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) { }
    }

    window.keyPressSound = function () {
      playBeep(850, 0.04);
      if (navigator.vibrate) navigator.vibrate(15);
    };

    let currentMode = 'snake';
    const canvas = document.getElementById('lcdCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('lcdOverlay');
    const scoreLabel = document.getElementById('lcdScore');
    let isRunning = false;
    let isPaused = false;
    let gameInterval = null;
    let birdAnim = null;

    window.setPhoneGame = function (mode) {
      window.keyPressSound();
      currentMode = mode;
      document.getElementById('btnModeSnake').classList.toggle('active', mode === 'snake');
      document.getElementById('btnModeBird').classList.toggle('active', mode === 'bird');
      document.getElementById('lcdGameTitle').innerText = mode === 'snake' ? 'SNAKE II' : 'FLAPPY BIRD';
      document.getElementById('lcdOverlayHeading').innerText = mode === 'snake' ? 'SNAKE II' : 'FLAPPY BIRD';
      document.getElementById('lcdOverlayText').innerText = mode === 'snake' ? 'Steer with D-Pad or Keys 2, 4, 6, 8' : 'Press OK / 5 / Space to Flap!';
      stopGame();
      overlay.classList.remove('hidden');
    };

    function stopGame() {
      isRunning = false;
      isPaused = false;
      if (gameInterval) clearInterval(gameInterval);
      if (birdAnim) cancelAnimationFrame(birdAnim);
    }

    window.startCurrentGame = function () {
      window.keyPressSound();
      overlay.classList.add('hidden');
      stopGame();
      isRunning = true;
      if (currentMode === 'snake') {
        startSnakeGame();
      } else {
        startBirdGame();
      }
    };

    window.pressSoftLeft = function () {
      if (!isRunning) window.startCurrentGame();
    };

    window.pressSoftRight = function () {
      window.keyPressSound();
      if (isRunning) {
        isPaused = !isPaused;
        if (isPaused) {
          document.getElementById('lcdOverlayHeading').innerText = 'PAUSED';
          document.getElementById('lcdOverlayText').innerText = 'Press OK to continue.';
          overlay.classList.remove('hidden');
        } else {
          overlay.classList.add('hidden');
        }
      }
    };

    window.pressSoftEnd = function () {
      window.keyPressSound();
      stopGame();
      document.getElementById('lcdOverlayHeading').innerText = 'STOPPED';
      document.getElementById('lcdOverlayText').innerText = 'Press SELECT or OK to play.';
      overlay.classList.remove('hidden');
    };

    // 1. SNAKE GAME
    const SNAKE_GRID = 16;
    const COLS = 20;
    const ROWS = 15;
    let snake = [];
    let food = { x: 10, y: 7 };
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let snakeScore = 0;

    function startSnakeGame() {
      snake = [{ x: 5, y: 7 }, { x: 4, y: 7 }, { x: 3, y: 7 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      snakeScore = 0;
      updateScore(0);
      spawnFood();
      renderSnake();
      gameInterval = setInterval(snakeTick, 130);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * COLS);
        food.y = Math.floor(Math.random() * ROWS);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function snakeTick() {
      if (isPaused || !isRunning) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
        onSnakeDeath();
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        snakeScore += 10;
        updateScore(snakeScore);
        playBeep(1200, 0.08);
        spawnFood();
      } else {
        snake.pop();
      }
      renderSnake();
    }

    function renderSnake() {
      ctx.fillStyle = '#9bbc0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f380f';
      ctx.fillRect(food.x * SNAKE_GRID + 2, food.y * SNAKE_GRID + 2, SNAKE_GRID - 4, SNAKE_GRID - 4);

      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#0f380f' : '#306230';
        ctx.fillRect(seg.x * SNAKE_GRID + 1, seg.y * SNAKE_GRID + 1, SNAKE_GRID - 2, SNAKE_GRID - 2);
      });
    }

    function onSnakeDeath() {
      stopGame();
      playBeep(220, 0.25);
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      document.getElementById('lcdOverlayHeading').innerText = 'GAME OVER';
      document.getElementById('lcdOverlayText').innerText = `Score: ${snakeScore}`;
      overlay.classList.remove('hidden');
    }

    // 2. FLAPPY BIRD GAME
    let birdY = 120;
    let birdVel = 0;
    const gravity = 0.28;
    const flapPower = -5.2;
    let pipes = [];
    let pipeSpawnCounter = 0;
    let birdScore = 0;

    function startBirdGame() {
      birdY = 100;
      birdVel = 0;
      pipes = [];
      pipeSpawnCounter = 0;
      birdScore = 0;
      updateScore(0);
      birdTick();
    }

    function birdFlap() {
      if (!isRunning || isPaused) return;
      birdVel = flapPower;
      playBeep(700, 0.05);
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function birdTick() {
      if (!isRunning) return;
      if (!isPaused) {
        birdVel += gravity;
        birdY += birdVel;

        pipeSpawnCounter++;
        if (pipeSpawnCounter > 85) {
          pipeSpawnCounter = 0;
          const gapSize = 75;
          const topHeight = Math.floor(Math.random() * (canvas.height - gapSize - 40)) + 20;
          pipes.push({ x: canvas.width, top: topHeight, bottom: topHeight + gapSize, scored: false });
        }

        for (let i = 0; i < pipes.length; i++) {
          pipes[i].x -= 2;
          if (!pipes[i].scored && pipes[i].x + 30 < 60) {
            pipes[i].scored = true;
            birdScore += 1;
            updateScore(birdScore);
            playBeep(1100, 0.06);
          }
        }
        pipes = pipes.filter(p => p.x > -40);

        const birdX = 60;
        const birdR = 8;
        if (birdY - birdR < 0 || birdY + birdR > canvas.height) {
          onBirdDeath();
          return;
        }

        for (let p of pipes) {
          if (birdX + birdR > p.x && birdX - birdR < p.x + 30) {
            if (birdY - birdR < p.top || birdY + birdR > p.bottom) {
              onBirdDeath();
              return;
            }
          }
        }
      }

      ctx.fillStyle = '#9bbc0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#306230';
      pipes.forEach(p => {
        ctx.fillRect(p.x, 0, 30, p.top);
        ctx.fillRect(p.x, p.bottom, 30, canvas.height - p.bottom);
      });

      ctx.fillStyle = '#0f380f';
      ctx.beginPath();
      ctx.arc(60, birdY, 8, 0, Math.PI * 2);
      ctx.fill();

      birdAnim = requestAnimationFrame(birdTick);
    }

    function onBirdDeath() {
      stopGame();
      playBeep(180, 0.3);
      if (navigator.vibrate) navigator.vibrate([80, 40, 100]);
      document.getElementById('lcdOverlayHeading').innerText = 'GAME OVER';
      document.getElementById('lcdOverlayText').innerText = `Score: ${birdScore} pipes`;
      overlay.classList.remove('hidden');
    }

    function updateScore(val) {
      if (scoreLabel) scoreLabel.innerText = String(val).padStart(3, '0');
    }

    window.phoneAction = function (action) {
      window.keyPressSound();
      if (!isRunning) {
        if (action === 'OK') window.startCurrentGame();
        return;
      }

      if (currentMode === 'snake') {
        if (action === 'UP' && dir.y === 0) nextDir = { x: 0, y: -1 };
        else if (action === 'DOWN' && dir.y === 0) nextDir = { x: 0, y: 1 };
        else if (action === 'LEFT' && dir.x === 0) nextDir = { x: -1, y: 0 };
        else if (action === 'RIGHT' && dir.x === 0) nextDir = { x: 1, y: 0 };
        else if (action === 'OK') window.pressSoftRight();
      } else {
        if (['UP', 'OK', 'DOWN'].includes(action)) birdFlap();
      }
    };

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW', 'Numpad8'].includes(e.code)) {
        e.preventDefault();
        window.phoneAction('UP');
      } else if (['ArrowDown', 'KeyS', 'Numpad2'].includes(e.code)) {
        e.preventDefault();
        window.phoneAction('DOWN');
      } else if (['ArrowLeft', 'KeyA', 'Numpad4'].includes(e.code)) {
        e.preventDefault();
        window.phoneAction('LEFT');
      } else if (['ArrowRight', 'KeyD', 'Numpad6'].includes(e.code)) {
        e.preventDefault();
        window.phoneAction('RIGHT');
      } else if (['Space', 'Enter', 'Numpad5'].includes(e.code)) {
        e.preventDefault();
        window.phoneAction('OK');
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!isRunning) window.startCurrentGame();
      else if (currentMode === 'bird') birdFlap();
    });
  })();
</script>
