<!-- Load marked.min.js & KaTeX for rich markdown, mathematical equations & engineering symbols -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  let activeDocId = null;
  let activeDocTitle = '';
  const chatHistory = []; // Rolling conversation memory buffer

  // Global Active Exam State
  let currentExamData = null;
  let currentExamIdx = 0;
  const examUserAnswers = {};
  const examCheckedStatus = {};

  function extractExamData(text) {
    if (!text || typeof text !== 'string') return null;
    // 1. Try matching complete JSON object first
    const fullMatch = text.match(/\{[\s\S]*?"questions"\s*:\s*\[[\s\S]*?\}\s*\]\s*\}/);
    if (fullMatch) {
      try {
        const parsed = JSON.parse(fullMatch[0]);
        if (parsed && Array.isArray(parsed.questions) && parsed.questions.length > 0) {
          return { data: parsed, rawMatch: fullMatch[0] };
        }
      } catch (e) {
        try {
          const cleaned = fullMatch[0].replace(/,\s*([\]\}])/g, '$1');
          const parsed = JSON.parse(cleaned);
          if (parsed && Array.isArray(parsed.questions) && parsed.questions.length > 0) {
            return { data: parsed, rawMatch: fullMatch[0] };
          }
        } catch (e2) {}
      }
    }

    // 2. Resilient Partial / Truncated Recovery
    if (text.includes('"questions"')) {
      const jsonStartIdx = text.search(/\{[\s\S]*?"questions"/);
      if (jsonStartIdx !== -1) {
        const jsonSubstring = text.slice(jsonStartIdx);
        // Extract title
        const titleMatch = jsonSubstring.match(/"title"\s*:\s*"([^"]+)"/);
        const title = titleMatch ? titleMatch[1] : 'Practice Exam Simulator';

        // Extract each individual question block
        const questions = [];
        const qRegex = /\{\s*"id"\s*:\s*\d+[\s\S]*?"question"\s*:\s*"[^"]+"[\s\S]*?\}(?=\s*,|\s*\])/g;
        let qm;
        while ((qm = qRegex.exec(jsonSubstring)) !== null) {
          try {
            const qObj = JSON.parse(qm[0]);
            if (qObj && qObj.question) questions.push(qObj);
          } catch (err) {
            try {
              const qObj = JSON.parse(qm[0].replace(/,\s*([\]\}])/g, '$1'));
              if (qObj && qObj.question) questions.push(qObj);
            } catch (err2) {}
          }
        }

        if (questions.length > 0) {
          return {
            data: { title, questions },
            rawMatch: jsonSubstring
          };
        }
      }
    }

    return null;
  }

  window.openExamModal = function(data) {
    if (!data || !Array.isArray(data.questions) || data.questions.length === 0) return;
    currentExamData = data;
    currentExamIdx = 0;
    for (let k in examUserAnswers) delete examUserAnswers[k];
    for (let k in examCheckedStatus) delete examCheckedStatus[k];

    const modal = document.getElementById('tarikaExamModal');
    const titleEl = document.getElementById('examModalTitle');
    if (titleEl) titleEl.textContent = data.title || 'Practice Exam Simulator';
    if (modal) {
      modal.style.display = 'flex';
      window.renderModalQuestion(0);
    }
  };

  window.closeExamModal = function() {
    const modal = document.getElementById('tarikaExamModal');
    if (modal) modal.style.display = 'none';
  };

  window.renderModalQuestion = function(idx) {
    if (!currentExamData || !currentExamData.questions[idx]) return;
    currentExamIdx = idx;
    const q = currentExamData.questions[idx];
    const total = currentExamData.questions.length;
    const progress = Math.round(((idx + 1) / total) * 100);

    const progFill = document.getElementById('examModalProgFill');
    if (progFill) progFill.style.width = `${progress}%`;

    const body = document.getElementById('examModalBody');
    const ftr = document.getElementById('examModalFtr');
    if (!body || !ftr) return;

    let typeLabel = 'MCQ (Single Choice)';
    if (q.type === 'msq') typeLabel = 'MSQ (Multi-Select)';
    else if (q.type === 'short') typeLabel = 'Short (1-Line Answer)';
    else if (q.type === 'brief') typeLabel = 'Brief / Descriptive';

    const isChecked = !!examCheckedStatus[q.id];

    body.innerHTML = `
      <div class="ai-exam-meta-bar">
        <span class="ai-exam-badge">${typeLabel}</span>
        <span class="ai-exam-badge marks">${q.marks || 2} Marks</span>
        <span class="ai-exam-step">Question ${idx + 1} of ${total}</span>
      </div>
      <div class="ai-exam-qtext-lg" id="modalQText"></div>
      <div class="ai-exam-ans-area" id="modalAnsArea"></div>
      <div id="modalExpBox" style="display:${isChecked ? 'block' : 'none'};"></div>
    `;

    const qTextEl = body.querySelector('#modalQText');
    if (qTextEl) {
      qTextEl.innerHTML = formatAiMarkdown(q.question);
      postProcessAiBubble(qTextEl);
    }

    const ansArea = body.querySelector('#modalAnsArea');

    if (q.type === 'mcq' && Array.isArray(q.options)) {
      q.options.forEach((opt) => {
        const isSelected = examUserAnswers[q.id] === opt;
        const optCard = document.createElement('div');
        optCard.className = 'ai-exam-opt-card' + (isSelected ? ' selected' : '');
        
        if (isChecked) {
          const isCorrect = isOptMatching(opt, q.correct_answer);
          if (isCorrect) optCard.classList.add('correct');
          else if (isSelected) optCard.classList.add('incorrect');
        }

        optCard.innerHTML = `
          <input type="radio" name="modal_q_${q.id}" value="${opt.replace(/"/g, '&quot;')}" ${isSelected ? 'checked' : ''} ${isChecked ? 'disabled' : ''}>
          <div style="flex:1;">${formatAiMarkdown(opt)}</div>
        `;
        if (!isChecked) {
          optCard.onclick = () => {
            examUserAnswers[q.id] = opt;
            ansArea.querySelectorAll('.ai-exam-opt-card').forEach(c => c.classList.remove('selected'));
            optCard.classList.add('selected');
            const r = optCard.querySelector('input');
            if (r) r.checked = true;
          };
        }
        ansArea.appendChild(optCard);
        postProcessAiBubble(optCard);
      });
    } else if (q.type === 'msq' && Array.isArray(q.options)) {
      if (!Array.isArray(examUserAnswers[q.id])) examUserAnswers[q.id] = [];
      q.options.forEach((opt) => {
        const isSelected = examUserAnswers[q.id].includes(opt);
        const optCard = document.createElement('div');
        optCard.className = 'ai-exam-opt-card' + (isSelected ? ' selected' : '');

        if (isChecked) {
          const isCorrect = Array.isArray(q.correct_options) ? q.correct_options.some(co => isOptMatching(opt, co)) : isOptMatching(opt, q.correct_answer);
          if (isCorrect) optCard.classList.add('correct');
          else if (isSelected) optCard.classList.add('incorrect');
        }

        optCard.innerHTML = `
          <input type="checkbox" name="modal_q_${q.id}" value="${opt.replace(/"/g, '&quot;')}" ${isSelected ? 'checked' : ''} ${isChecked ? 'disabled' : ''}>
          <div style="flex:1;">${formatAiMarkdown(opt)}</div>
        `;
        if (!isChecked) {
          optCard.onclick = (e) => {
            if (e.target.tagName !== 'INPUT') {
              const cb = optCard.querySelector('input');
              if (cb) cb.checked = !cb.checked;
            }
            const cb = optCard.querySelector('input');
            if (cb && cb.checked) {
              if (!examUserAnswers[q.id].includes(opt)) examUserAnswers[q.id].push(opt);
              optCard.classList.add('selected');
            } else {
              examUserAnswers[q.id] = examUserAnswers[q.id].filter(x => x !== opt);
              optCard.classList.remove('selected');
            }
          };
        }
        ansArea.appendChild(optCard);
        postProcessAiBubble(optCard);
      });
    } else if (q.type === 'short') {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'ai-exam-input';
      inp.placeholder = 'Type your one-line answer here...';
      inp.value = examUserAnswers[q.id] || '';
      inp.disabled = isChecked;
      inp.oninput = () => { examUserAnswers[q.id] = inp.value; };
      ansArea.appendChild(inp);
      if (!isChecked) setTimeout(() => inp.focus(), 60);
    } else { // brief
      const ta = document.createElement('textarea');
      ta.className = 'ai-exam-textarea';
      ta.rows = 4;
      ta.placeholder = 'Write your technical answer and core keywords here...';
      ta.value = examUserAnswers[q.id] || '';
      ta.disabled = isChecked;
      ta.oninput = () => { examUserAnswers[q.id] = ta.value; };
      ansArea.appendChild(ta);
      if (!isChecked) setTimeout(() => ta.focus(), 60);
    }

    if (isChecked) {
      renderExplanationBox(body.querySelector('#modalExpBox'), q);
    }

    // Footer actions
    ftr.innerHTML = `
      <div>
        ${idx > 0 ? `<button type="button" class="ai-exam-btn sec" onclick="renderModalQuestion(${idx - 1})">← Previous</button>` : ''}
      </div>
      <div style="display:flex;gap:8px;">
        ${!isChecked ? `<button type="button" class="ai-exam-btn sec" onclick="checkCurrentModalQuestion(${idx})">💡 Check Answer & Explanation</button>` : ''}
        ${idx < total - 1 ? `<button type="button" class="ai-exam-btn pri" onclick="renderModalQuestion(${idx + 1})">Next Question ➔</button>` : `<button type="button" class="ai-exam-btn pri" onclick="renderModalScorecard()">View Final Scorecard 🏆</button>`}
      </div>
    `;
  }

  function isOptMatching(opt, target) {
    if (!opt || !target) return false;
    const cleanOpt = opt.trim().toLowerCase();
    const cleanTarget = String(target).trim().toLowerCase();
    if (cleanOpt === cleanTarget) return true;
    const optLetter = cleanOpt.match(/^([a-d])[\)\.]/);
    const targetLetter = cleanTarget.match(/^([a-d])[\)\.]/);
    if (optLetter && targetLetter && optLetter[1] === targetLetter[1]) return true;
    if (optLetter && cleanTarget === optLetter[1]) return true;
    return false;
  }

  window.checkCurrentModalQuestion = function(idx) {
    if (!currentExamData || !currentExamData.questions[idx]) return;
    const q = currentExamData.questions[idx];
    examCheckedStatus[q.id] = true;
    renderModalQuestion(idx);
  };

  function renderExplanationBox(box, q) {
    if (!box) return;
    const expText = q.explanation || q.model_answer || 'Check the correct answer and core technical principles.';
    const keywordsText = Array.isArray(q.keywords) && q.keywords.length > 0 ? q.keywords.join(', ') : null;
    const correctAnsStr = q.correct_answer || (Array.isArray(q.correct_options) ? q.correct_options.join(', ') : null) || q.model_answer;

    box.className = 'ai-exam-exp-box';
    box.innerHTML = `
      <div class="ai-exam-exp-title">💡 Correct Solution & Detailed Explanation</div>
      ${correctAnsStr ? `<div style="font-size:12px;margin-bottom:6px;color:#34d399;"><strong>Correct Answer:</strong> ${formatAiMarkdown(correctAnsStr)}</div>` : ''}
      <div class="ai-exam-exp-content">${formatAiMarkdown(expText)}</div>
      ${keywordsText ? `<div class="ai-exam-keywords">🔑 <strong>Key Keywords:</strong> ${keywordsText}</div>` : ''}
    `;
    postProcessAiBubble(box);
  }

  window.renderModalScorecard = function() {
    if (!currentExamData) return;
    const total = currentExamData.questions.length;
    let score = 0;
    let totalPossible = 0;

    currentExamData.questions.forEach((q) => {
      const marks = q.marks || 2;
      totalPossible += marks;
      const userAns = examUserAnswers[q.id];
      if (q.type === 'mcq' && isOptMatching(userAns, q.correct_answer)) {
        score += marks;
      } else if (q.type === 'msq' && Array.isArray(userAns) && Array.isArray(q.correct_options)) {
        const correctCount = userAns.filter(u => q.correct_options.some(co => isOptMatching(u, co))).length;
        if (correctCount === q.correct_options.length && userAns.length === q.correct_options.length) {
          score += marks;
        } else if (correctCount > 0) {
          score += Math.round(marks / 2);
        }
      } else if (userAns && String(userAns).trim().length > 3) {
        // Partial credit for short/brief on self-attempt
        score += Math.round(marks * 0.75);
      }
    });

    const pct = Math.round((score / totalPossible) * 100);
    const badge = pct >= 80 ? '🌟 Outstanding Performance' : (pct >= 50 ? '👍 Good Effort — Keep Practicing' : '📚 Needs Review');

    const body = document.getElementById('examModalBody');
    const ftr = document.getElementById('examModalFtr');
    const progFill = document.getElementById('examModalProgFill');
    if (progFill) progFill.style.width = '100%';

    body.innerHTML = `
      <div style="text-align:center;padding:16px 0 20px;">
        <div style="font-size:38px;margin-bottom:8px;">🏆</div>
        <h2 style="font-size:20px;color:#fff;margin:0 0 6px;">Exam Completed!</h2>
        <div style="font-size:24px;font-weight:800;color:#38bdf8;margin:8px 0;">${score} / ${totalPossible} <span style="font-size:14px;color:#94a3b8;">(${pct}%)</span></div>
        <div class="ai-exam-badge marks" style="font-size:12px;padding:4px 12px;display:inline-block;">${badge}</div>
      </div>
      <div style="font-size:13px;font-weight:700;color:#e2e8f0;margin-bottom:10px;">📋 Question Review:</div>
      <div id="modalReviewList" style="display:flex;flex-direction:column;gap:10px;"></div>
    `;

    const reviewList = body.querySelector('#modalReviewList');
    currentExamData.questions.forEach((q, i) => {
      const item = document.createElement('div');
      item.style.background = 'rgba(255,255,255,0.03)';
      item.style.border = '1px solid rgba(255,255,255,0.08)';
      item.style.borderRadius = '10px';
      item.style.padding = '10px 14px';
      
      const userAns = examUserAnswers[q.id] || 'Not answered';
      const ansStr = Array.isArray(userAns) ? userAns.join(', ') : userAns;
      const correctStr = q.correct_answer || (Array.isArray(q.correct_options) ? q.correct_options.join(', ') : null) || q.model_answer;

      item.innerHTML = `
        <div style="font-size:12px;font-weight:600;color:#cbd5e1;margin-bottom:4px;">Q${i+1}. ${q.question}</div>
        <div style="font-size:11px;color:#94a3b8;">Your Answer: <span style="color:#fff;">${ansStr}</span></div>
        ${correctStr ? `<div style="font-size:11px;color:#34d399;margin-top:2px;">Correct Solution: ${correctStr}</div>` : ''}
      `;
      reviewList.appendChild(item);
    });

    ftr.innerHTML = `
      <button type="button" class="ai-exam-btn sec" onclick="openExamModal(currentExamData)">🔄 Retake Exam</button>
      <div style="display:flex;gap:8px;">
        <button type="button" class="ai-exam-btn pri" onclick="submitExamScoreToTarika()">📤 Send to Tarika for Strict Marking</button>
        <button type="button" class="ai-exam-btn sec" onclick="closeExamModal()">✕ Close</button>
      </div>
    `;
  };

  window.submitExamScoreToTarika = function() {
    if (!currentExamData) return;
    closeExamModal();
    let prompt = `📝 EXAM SUBMISSION FOR EVALUATION\nExam Title: ${currentExamData.title || 'Practice Exam'}\n\n`;
    currentExamData.questions.forEach((q, i) => {
      const userAns = examUserAnswers[q.id] || 'Not answered';
      const ansStr = Array.isArray(userAns) ? userAns.join(', ') : userAns;
      prompt += `Question ${i + 1} [Type: ${q.type}, Marks: ${q.marks || 2}]:\n${q.question}\nKeywords: ${(q.keywords || []).join(', ') || 'N/A'}\nStudent Answer: ${ansStr}\n\n`;
    });
    prompt += `Please strictly evaluate each question: check for matching keywords vs missed keywords, award exact marks, highlight errors, and output the total score with complete model solutions.`;
    quickSend(prompt);
  };

  function formatAiMarkdown(text) {
    if (!text) return '';

    // Intercept Exam JSON and replace with interactive Launch Card
    const examResult = extractExamData(text);
    let examCardHtml = '';
    if (examResult && examResult.data) {
      const ex = examResult.data;
      window.__LATEST_EXAM__ = ex;
      // Strip raw JSON and any surrounding code block fences
      if (examResult.rawMatch) {
        text = text.replace(examResult.rawMatch, '');
      }
      text = text
        .replace(/```(?:exam_stimulus|json)?[\s\S]*?"questions"[\s\S]*?(?:```|$)/gi, '')
        .replace(/\{[\s\S]*?"questions"[\s\S]*?(?:\}\s*\]\s*\}|$)/gi, '')
        .replace(/```(?:exam_stimulus|json)?\s*```/gi, '')
        .trim();

      const qCount = ex.questions.length;
      examCardHtml = `
        <div class="ai-exam-launch-card" style="margin: 12px 0;">
          <div class="ai-exam-launch-icon">🎯</div>
          <div class="ai-exam-launch-info">
            <div class="ai-exam-launch-title">${ex.title || 'Practice Exam Simulator'}</div>
            <div class="ai-exam-launch-sub">${qCount} Questions • Interactive Exam Environment with Instant Solutions</div>
          </div>
          <button type="button" class="ai-exam-launch-btn" onclick="openExamModal(window.__LATEST_EXAM__)">Start Exam 🚀</button>
        </div>
      `;
    }

    // Protect LaTeX math expressions before markdown parsing to prevent markdown corruption
    const mathTokens = [];
    // 1. Block math: $$ ... $$ or \[ ... \]
    let processed = text
      .replace(/\$\$([\s\S]*?)\$\$/g, (match, expr) => {
        const id = `@@MATH_BLOCK_${mathTokens.length}@@`;
        mathTokens.push({ id, expr, display: true });
        return id;
      })
      .replace(/\\\[([\s\S]*?)\\\]/g, (match, expr) => {
        const id = `@@MATH_BLOCK_${mathTokens.length}@@`;
        mathTokens.push({ id, expr, display: true });
        return id;
      })
      // 2. Inline math: \( ... \) or $ ... $ (excluding empty or trailing currency)
      .replace(/\\\(([\s\S]*?)\\\)/g, (match, expr) => {
        const id = `@@MATH_INLINE_${mathTokens.length}@@`;
        mathTokens.push({ id, expr, display: false });
        return id;
      })
      .replace(/(^|[^\\])\$([^\$\n]+?)\$/g, (match, prefix, expr) => {
        const id = `@@MATH_INLINE_${mathTokens.length}@@`;
        mathTokens.push({ id, expr, display: false });
        return prefix + id;
      });

    let html = '';
    if (typeof marked !== 'undefined' && marked.parse) {
      try {
        marked.setOptions({ gfm: true, breaks: true });
        html = marked.parse(processed);
      } catch (e) {
        console.warn('[Tarika Markdown Error]', e);
      }
    }

    // Safe fallback markdown parsing if marked is unavailable
    if (!html) {
      html = processed
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
    }

    // Replace math placeholders with KaTeX rendered HTML or fallback
    mathTokens.forEach(({ id, expr, display }) => {
      let renderedMath = '';
      if (typeof katex !== 'undefined' && katex.renderToString) {
        try {
          renderedMath = katex.renderToString(expr.trim(), {
            displayMode: display,
            throwOnError: false
          });
        } catch (e) {
          renderedMath = display ? `<div class="katex-fallback">$$${expr}$$</div>` : `<span class="katex-fallback">$${expr}$</span>`;
        }
      } else {
        renderedMath = display ? `<div class="katex-fallback">$$${expr}$$</div>` : `<span class="katex-fallback">$${expr}$</span>`;
      }
      html = html.replace(id, renderedMath);
    });

    if (examCardHtml) {
      html += examCardHtml;
    }

    return html;
  }

  function postProcessAiBubble(bubble) {
    // 1. Wrap tables for responsive horizontal scrolling
    bubble.querySelectorAll('table').forEach(table => {
      if (!table.parentElement.classList.contains('ai-table-wrap')) {
        const wrap = document.createElement('div');
        wrap.className = 'ai-table-wrap';
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
      }
    });

    // 2. Add copy button to code blocks
    bubble.querySelectorAll('pre').forEach(pre => {
      if (pre.querySelector('.ai-code-copy-btn')) return;
      const copyBtn = document.createElement('button');
      copyBtn.className = 'ai-code-copy-btn';
      copyBtn.type = 'button';
      copyBtn.textContent = 'Copy';
      copyBtn.onclick = (e) => {
        e.stopPropagation();
        const codeEl = pre.querySelector('code') || pre;
        const textToCopy = codeEl.innerText.replace(/Copy$/, '').trim();
        navigator.clipboard.writeText(textToCopy).then(() => {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
        }).catch(() => {
          copyBtn.textContent = 'Failed';
          setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
        });
      };
      pre.appendChild(copyBtn);
    });

    // 3. Open markdown links safely in new tab
    bubble.querySelectorAll('a').forEach(a => {
      if (!a.classList.contains('ai-card-btn')) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
    });

    // 4. Auto-render remaining math formulas if any
    if (typeof renderMathInElement === 'function') {
      try {
        renderMathInElement(bubble, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError: false
        });
      } catch (err) {
        console.warn('[KaTeX Render in Element]', err);
      }
    }

    // 5. Auto-launch dialog modal if latest exam is ready
    if (window.__LATEST_EXAM__ && !bubble.dataset.examAutoOpened) {
      bubble.dataset.examAutoOpened = 'true';
      const modal = document.getElementById('tarikaExamModal');
      if (modal && modal.style.display !== 'flex') {
        setTimeout(() => openExamModal(window.__LATEST_EXAM__), 300);
      }
    }
  }

  async function streamAiResponse(bubble, text, onComplete) {
    if (!text) {
      if (onComplete) onComplete();
      return;
    }
    const msgList = document.getElementById('aiMsgList');
    const tokens = text.match(/\S+|\s+/g) || [text];
    let currentText = '';
    let idx = 0;
    const step = Math.max(1, Math.ceil(tokens.length / 50));
    const intervalMs = 14;

    bubble.classList.add('streaming');

    return new Promise((resolve) => {
      const timer = setInterval(() => {
        const nextIdx = Math.min(idx + step, tokens.length);
        for (let i = idx; i < nextIdx; i++) {
          currentText += tokens[i];
        }
        idx = nextIdx;

        bubble.innerHTML = formatAiMarkdown(currentText) + (idx < tokens.length ? '<span class="ai-stream-cursor">▌</span>' : '');
        postProcessAiBubble(bubble);
        if (msgList) {
          msgList.scrollTo({ top: msgList.scrollHeight, behavior: 'smooth' });
        }

        if (idx >= tokens.length) {
          clearInterval(timer);
          bubble.classList.remove('streaming');
          bubble.innerHTML = formatAiMarkdown(text);
          postProcessAiBubble(bubble);
          if (msgList) {
            msgList.scrollTo({ top: msgList.scrollHeight, behavior: 'smooth' });
          }
          if (onComplete) onComplete();
          resolve();
        }
      }, intervalMs);
    });
  }

  // Detect open document across AbhiHub (p_pdf_reader, resource.html, viewer iframe, or URL)
  function detectOpenDocument() {
    // 1. Explicit window.__CURRENT_DOC__
    if (window.__CURRENT_DOC__ && window.__CURRENT_DOC__.id) {
      activeDocId = window.__CURRENT_DOC__.id;
      activeDocTitle = window.__CURRENT_DOC__.title || '';
    } else if (window.VALID_DOC_ID) {
      activeDocId = window.VALID_DOC_ID;
    }

    // 2. Iframe src check (PDF viewer iframe: /api/view-doc/<uuid>/...)
    if (!activeDocId) {
      const viewerIframe = document.querySelector('iframe[src*="/api/view-doc/"], iframe[src*="viewer.html"]');
      if (viewerIframe && viewerIframe.src) {
        const m = viewerIframe.src.match(/\/api\/view-doc\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
        if (m) activeDocId = m[1];
      }
    }

    // 3. UUID in current URL
    if (!activeDocId) {
      const uuidMatch = window.location.href.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
      if (uuidMatch) {
        activeDocId = uuidMatch[0];
      } else {
        const match = window.location.pathname.match(/\/resource\/([^\/\?]+)/);
        if (match) {
          activeDocId = match[1].replace('-view', '');
        } else {
          const urlParams = new URLSearchParams(window.location.search);
          const rid = urlParams.get('record_id') || urlParams.get('doc_id') || urlParams.get('pdf_name') || urlParams.get('id');
          if (rid) activeDocId = rid;
        }
      }
    }

    // 4. Resolve document title from DOM
    if (!activeDocTitle) {
      const heading = document.querySelector('.resource-title, .reader-title, h1');
      if (heading && heading.textContent.trim()) {
        activeDocTitle = heading.textContent.trim();
      } else {
        activeDocTitle = document.title.replace('— AbhiHub', '').replace('— AbhiHub Reader', '').trim();
      }
    }

    const ctxBar = document.getElementById('aiContextBar');
    const ctxDocName = document.getElementById('aiContextDocName');
    if ((activeDocId || activeDocTitle) && ctxBar && ctxDocName) {
      ctxDocName.textContent = '📄 ' + (activeDocTitle.slice(0, 42) || 'Active Document');
      ctxBar.style.display = 'block';
    }
  }

  window.toggleAbhiAiDrawer = function() {
    const drw = document.getElementById('abhiAiDrawer');
    if (!drw) return;
    drw.classList.toggle('open');
    if (drw.classList.contains('open')) {
      detectOpenDocument();
      const prefModel = localStorage.getItem('ai_preferred_model');
      const badge = document.getElementById('aiDrawerModelBadge');
      if (prefModel && badge) {
        badge.textContent = prefModel.split('/')[1] || 'BYOK';
      }
      setTimeout(() => document.getElementById('aiChatInput')?.focus(), 150);
    }
  };

  window.askAiAboutFile = function(promptText) {
    const input = document.getElementById('aiChatInput');
    if (input) input.value = promptText;
    sendAiMessage();
  };

  window.quickSend = function(text) {
    const input = document.getElementById('aiChatInput');
    if (input) input.value = text;
    sendAiMessage();
  };

  window.sendAiMessage = async function() {
    const input = document.getElementById('aiChatInput');
    const sendBtn = document.getElementById('aiSendBtn');
    const msgList = document.getElementById('aiMsgList');
    if (!input || !sendBtn || !msgList) return;

    const query = input.value.trim();
    if (!query) return;

    // Refresh document context immediately prior to dispatch
    detectOpenDocument();

    // Add user message
    const uBubble = document.createElement('div');
    uBubble.className = 'ai-bubble user';
    uBubble.textContent = query;
    msgList.appendChild(uBubble);
    input.value = '';

    // Thinking indicator
    const thinking = document.createElement('div');
    thinking.className = 'ai-bubble thinking';
    thinking.textContent = activeDocId ? 'Analyzing open document & questions...' : 'Thinking & checking AbhiHub catalog...';
    msgList.appendChild(thinking);
    msgList.scrollTop = msgList.scrollHeight;

    sendBtn.disabled = true;

    const historySnapshot = chatHistory.slice(-6);
    chatHistory.push({ role: 'user', content: query });

    try {
      const preferredModel = localStorage.getItem('ai_preferred_model') || null;
      const res = await fetch('/api/ai/assistant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: query,
          doc_id: activeDocId,
          doc_title: activeDocTitle,
          model: preferredModel,
          history: historySnapshot
        })
      });

      thinking.remove();

      if (res.status === 401 || res.redirected) {
        const errBubble = document.createElement('div');
        errBubble.className = 'ai-bubble assistant';
        errBubble.innerHTML = '⚠️ Please <a href="/login" style="color:#60a5fa;">log in</a> to use the assistant.';
        msgList.appendChild(errBubble);
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch (e) {
        data = { success: false, message: `Server error (${res.status}). Please check your model or try again.` };
      }
      const aBubble = document.createElement('div');
      aBubble.className = 'ai-bubble assistant';

      if (data.success) {
        chatHistory.push({ role: 'assistant', content: data.reply || '' });
        if (chatHistory.length > 12) chatHistory.splice(0, chatHistory.length - 12);

        msgList.appendChild(aBubble);
        msgList.scrollTop = msgList.scrollHeight;

        await streamAiResponse(aBubble, data.reply || '', () => {
          // Render Action Cards if documents were found
          if (data.actions && data.actions.length > 0) {
            data.actions.forEach(act => {
              const card = document.createElement('div');
              card.className = 'ai-action-card';
              card.innerHTML = `
                <div>
                  <span class="ai-card-badge">${act.category || 'DOC'}</span>
                  <div class="ai-card-title" title="${act.title}">${act.title}</div>
                </div>
                <a href="${act.url}" class="ai-card-btn" target="_self">Open In App ➔</a>
              `;
              aBubble.appendChild(card);
            });
          }

          // Auto-navigate if requested
          if (data.auto_open) {
            const autoNotif = document.createElement('div');
            autoNotif.style.fontSize = '11px';
            autoNotif.style.color = '#34d399';
            autoNotif.style.marginTop = '6px';
            autoNotif.textContent = 'Opening document in 2 seconds...';
            aBubble.appendChild(autoNotif);
            setTimeout(() => { window.location.href = data.auto_open; }, 1800);
          }
          msgList.scrollTop = msgList.scrollHeight;
        });

      } else {
        aBubble.innerHTML = '⚠️ ' + (data.message || 'Error processing request');
        msgList.appendChild(aBubble);
        msgList.scrollTop = msgList.scrollHeight;
      }

    } catch (err) {
      thinking.remove();
      const errBubble = document.createElement('div');
      errBubble.className = 'ai-bubble assistant';
      errBubble.textContent = '⚠️ Network error connecting to AI Assistant.';
      msgList.appendChild(errBubble);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  };

  document.addEventListener('DOMContentLoaded', detectOpenDocument);
})();
</script>
