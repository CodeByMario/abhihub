<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create MemoryWall — AbhiHub</title>
  <meta name="description" content="Create your personal MemoryWall and let friends describe you in 3 words.">
  <meta name="robots" content="noindex">
  
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='premium/css/style.css', v='2.0.1') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/know-me.css') }}">
  {% set user_profile_json = get_full_profile_json() | tojson %}
  {% include 'google_tag.html' %}
</head>

<body>

  <div class="km-hero" style="padding-bottom:3rem;">
    <span class="km-hero-emoji">🧠</span>
    <h1>Create Your MemoryWall</h1>
    <p>Let friends describe you in 3 words and leave a memory.</p>
  </div>

  <div class="km-container" style="margin-top:-1.5rem;">
    <div class="km-card">

      {% if error %}
      <div class="km-alert km-alert--error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('memorywall_create') }}" id="km-create-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="km-form-row">
          <label class="km-label" for="km-title">Your Name / Wall Title *</label>
          <input class="km-input" type="text" id="km-title" name="title" placeholder="e.g. Abhijeet's MemoryWall"
            maxlength="80" required autocomplete="off">
          <div style="font-size:0.78rem;color:var(--km-muted);margin-top:0.3rem;">
            This is what friends will see when they visit your wall.
          </div>
        </div>

        <div class="km-form-row">
          <label class="km-label" for="km-college">College</label>
          <input class="km-input" type="text" id="km-college" name="college" placeholder="e.g. GHRCE, Nagpur"
            maxlength="100">
        </div>

        <div style="display:flex;gap:0.8rem;">
          <div class="km-form-row" style="flex:1;">
            <label class="km-label" for="km-branch">Branch</label>
            <input class="km-input" type="text" id="km-branch" name="branch" placeholder="e.g. Computer Science"
              maxlength="100">
          </div>
          <div class="km-form-row" style="flex:0 0 110px;">
            <label class="km-label" for="km-year">Grad Year</label>
            <input class="km-input" type="number" id="km-year" name="graduation_year" placeholder="2026" min="2000"
              max="2035">
          </div>
        </div>

        <button type="submit" class="km-btn km-btn--primary" id="km-create-btn">
          ✨ Create My MemoryWall
        </button>

      </form>
    </div>

    <a href="{{ url_for('memorywall_dashboard') }}" class="km-btn km-btn--ghost"
      style="display:block;text-align:center;margin-top:0.5rem;">
      ← Back
    </a>
  </div>

  <script src="{{ url_for('static', filename='js/know-me.js') }}" defer></script>
</body>

</html>
