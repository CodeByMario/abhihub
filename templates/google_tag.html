<!-- Google Analytics 4 - Privacy-Safe Canonical Measurement -->
<script>
  window.dataLayer = window.dataLayer || [];
  const CONSENT_KEY = 'abhihub-consent';
  const GA_MEASUREMENT_ID = 'G-EH5BGS9BEG';

  function getConsentChoice() {
    try {
      return localStorage.getItem(CONSENT_KEY) === 'granted';
    } catch (e) {
      return false;
    }
  }

  function setConsentChoice(granted) {
    try {
      localStorage.setItem(CONSENT_KEY, granted ? 'granted' : 'denied');
    } catch (e) { }
    if (window.AbhiHubAnalytics) {
      window.AbhiHubAnalytics.track('consent_updated', { analytics_allowed: Boolean(granted) });
    }
    window.location.reload();
  }

  function ensureConsentBanner() {
    if (document.getElementById('abhihub-consent-banner')) return;

    const banner = document.createElement('div');
    banner.id = 'abhihub-consent-banner';
    banner.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#0f172a;color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 -8px 24px rgba(0,0,0,.2);';
    banner.innerHTML = '<span style="font-size:14px;line-height:1.4;">We use analytics to improve study note quality and platform performance. Accept to enable privacy-conscious analytics. <a href="/privacy" style="color:#bfdbfe;text-decoration:underline;">Privacy policy</a></span><span style="display:flex;gap:8px;"><button data-consent="accept" style="border:0;border-radius:999px;padding:8px 14px;background:#2563eb;color:#fff;cursor:pointer;font-weight:600;">Accept</button><button data-consent="decline" style="border:0;border-radius:999px;padding:8px 14px;background:#475569;color:#fff;cursor:pointer;">Decline</button></span>';
    document.body.appendChild(banner);

    banner.querySelector('[data-consent="accept"]').addEventListener('click', function () {
      setConsentChoice(true);
    });

    banner.querySelector('[data-consent="decline"]').addEventListener('click', function () {
      setConsentChoice(false);
    });
  }

  window.AbhiHubConsent = {
    hasConsent: getConsentChoice,
    setConsent: setConsentChoice
  };

  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = gtag;

  // Server-injected profile (sanitized: NO email, NO mobile, NO passwords)
  window.ABHIHUB_USER_PROFILE = {{ user_profile_json | default(get_full_profile_json()) | tojson }};

  function initializeAnalytics() {
    const isLocal = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|.*\.local)$/.test(window.location.hostname);
    if (!getConsentChoice()) {
      window.__ABHIHUB_ANALYTICS_DISABLED__ = true;
      return;
    }

    if (isLocal) {
      console.info('[Analytics] Running in local development mode. Live GA4 hits are silenced.');
      return;
    }

    const gtagScript = document.createElement('script');
    gtagScript.async = true;
    gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID;
    document.head.appendChild(gtagScript);

    gtagScript.onload = function () {
      window.gtag('js', new Date());
      window.gtag('consent', 'default', { analytics_storage: 'granted' });

      window.gtag('config', GA_MEASUREMENT_ID, {
        page_path: window.location.pathname,
        page_title: document.title,
        send_page_view: true,
        anonymize_ip: true,
        allow_google_signals: false,
        allow_ad_personalization_signals: false
      });

      const profile = window.ABHIHUB_USER_PROFILE || {};
      if (window.AbhiHubAnalytics) {
        window.AbhiHubAnalytics.setUser({
          userId: profile.userId || 'anonymous',
          role: profile.role || 'anonymous',
          college: profile.college || '',
          branch: profile.branch || '',
          yearOfStudy: profile.yearOfStudy || ''
        });
      }
    };
  }

  if (!getConsentChoice()) {
    window.__ABHIHUB_ANALYTICS_DISABLED__ = true;
    document.addEventListener('DOMContentLoaded', ensureConsentBanner);
  } else {
    initializeAnalytics();
  }
</script>
<script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
<script src="{{ url_for('static', filename='js/analytics-helper.js') }}" defer></script>
