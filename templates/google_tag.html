<!-- Google Analytics 4 - Comprehensive Tracking with Full User Profile -->
<script>
  window.dataLayer = window.dataLayer || [];
  const CONSENT_KEY = 'abhihub-consent';

  function getConsentChoice() {
    try {
      return localStorage.getItem(CONSENT_KEY) === 'granted';
    } catch (e) {
      return false;
    }
  }

  function setConsentChoice(granted) {
    try {
      localStorage.setItem(CONSENT_KEY, granted ? 'granted' : 'denied');
    } catch (e) {}
    window.location.reload();
  }

  function ensureConsentBanner() {
    if (document.getElementById('abhihub-consent-banner')) return;

    const banner = document.createElement('div');
    banner.id = 'abhihub-consent-banner';
    banner.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#0f172a;color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 -8px 24px rgba(0,0,0,.2);';
    banner.innerHTML = '<span style="font-size:14px;line-height:1.4;">We use analytics to improve AbhiHub. Accept to enable analytics and improve your experience. <a href="/privacy" style="color:#bfdbfe;text-decoration:underline;">Privacy policy</a></span><span style="display:flex;gap:8px;"><button data-consent="accept" style="border:0;border-radius:999px;padding:8px 12px;background:#2563eb;color:#fff;cursor:pointer;">Accept</button><button data-consent="decline" style="border:0;border-radius:999px;padding:8px 12px;background:#475569;color:#fff;cursor:pointer;">Decline</button></span>';
    document.body.appendChild(banner);

    banner.querySelector('[data-consent="accept"]').addEventListener('click', function() {
      setConsentChoice(true);
    });

    banner.querySelector('[data-consent="decline"]').addEventListener('click', function() {
      setConsentChoice(false);
    });
  }

  window.AbhiHubConsent = {
    hasConsent: getConsentChoice,
    setConsent: setConsentChoice
  };

  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = gtag;

  // ── Full user profile from server ──
  window.ABHIHUB_USER_PROFILE = {{ user_profile_json | tojson }};

  // ── Session tracking state ──
  window.ABHIHUB_SESSION_START = Date.now();
  window.ABHIHUB_SESSION_ID = sessionStorage.getItem('ga_session_id') || 
    ('session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9));
  sessionStorage.setItem('ga_session_id', window.ABHIHUB_SESSION_ID);

  // Page view tracking state
  window.ABHIHUB_PAGE_VIEWS = 0;
  window.ABHIHUB_FILE_VIEWS = 0;
  window.ABHIHUB_DOWNLOADS = 0;
  window.ABHIHUB_SEARCHES = 0;

  // File stay time tracking
  window.ABHIHUB_CURRENT_FILE = null;
  window.ABHIHUB_FILE_OPEN_TIME = 0;

  function initializeAnalytics() {
    if (!getConsentChoice()) {
      window.__ABHIHUB_ANALYTICS_DISABLED__ = true;
      return;
    }

    const gtagScript = document.createElement('script');
    gtagScript.async = true;
    gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-EH5BGS9BEG';
    document.head.appendChild(gtagScript);

    gtagScript.onload = function() {
      window.gtag = function() { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('consent', 'default', { analytics_storage: 'granted' });
      
      // ── Configure GA4 with custom dimensions ──
      window.gtag('config', 'G-EH5BGS9BEG', {
        page_path: window.location.pathname,
        page_title: document.title,
        send_page_view: true,
        anonymize_ip: true,
        allow_google_signals: false,
        allow_ad_personalization_signals: false
      });

      // ── Set user ID ──
      const profile = window.ABHIHUB_USER_PROFILE || {};
      window.gtag('set', { user_id: profile.userId || 'anonymous' });

      // ── Set comprehensive user properties ──
      // NOTE: Do NOT send PII (email, mobile) to GA4 per Google ToS
      // Use user_id (UUID) for user identification only
      window.gtag('set', {
        user_properties: {
          // Identity (non-PII)
          user_type: profile.isAuthenticated ? 'authenticated' : 'anonymous',
          user_id: profile.userId || 'anonymous',
          user_name: profile.name || '',  // Display name only - acceptable
          
          // Academic context
          user_college: profile.college || '',
          user_branch: profile.branch || '',
          user_year_of_study: profile.yearOfStudy || '',
          user_role: profile.role || 'anonymous',
          
          // Platform
          platform: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
          app_version: '{{ app_version | default("1.0.0") }}',
          
          // Session
          session_id: window.ABHIHUB_SESSION_ID,
          session_start_time: new Date(window.ABHIHUB_SESSION_START).toISOString()
        }
      });

      // ── Send initial page view with full context ──
      sendEnhancedPageView();

      // ── Track session start for authenticated users ──
      if (profile.isAuthenticated) {
        window.gtag('event', 'session_start_custom', {
          logged_in: true,
          user_id: profile.userId,
          // NO PII - user_email removed per GA4 ToS
          user_name: profile.name,
          college: profile.college,
          branch: profile.branch,
          year_of_study: profile.yearOfStudy
        });
      }

      // ── Track page performance ──
      trackPagePerformance();

      console.log('[GA4] Analytics initialized with user profile:', profile);
    };
  }

  // ── Enhanced Page View Tracking ──
  function sendEnhancedPageView() {
    if (window.__ABHIHUB_ANALYTICS_DISABLED__) return;
    
    const profile = window.ABHIHUB_USER_PROFILE || {};
    window.ABHIHUB_PAGE_VIEWS++;

    window.gtag('event', 'page_view', {
      page_title: document.title,
      page_path: window.location.pathname,
      page_location: window.location.href,
      page_category: getPageCategory(),
      page_name: document.title,
      referrer: document.referrer,
      session_id: window.ABHIHUB_SESSION_ID,
      
      // User context (NO PII - use user_id only per GA4 ToS)
      user_id: profile.userId || 'anonymous',
      user_name: profile.name || '',
      user_college: profile.college || '',
      user_branch: profile.branch || '',
      user_year_of_study: profile.yearOfStudy || '',
      user_role: profile.role || 'anonymous',
      user_type: profile.isAuthenticated ? 'authenticated' : 'anonymous',
      
      // Session metrics
      session_id: window.ABHIHUB_SESSION_ID,
      session_page_views: window.ABHIHUB_PAGE_VIEWS,
      session_file_views: window.ABHIHUB_FILE_VIEWS,
      session_downloads: window.ABHIHUB_DOWNLOADS,
      session_searches: window.ABHIHUB_SEARCHES,
      time_on_site_seconds: Math.floor((Date.now() - window.ABHIHUB_SESSION_START) / 1000),
      
      // Technical
      platform: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
      user_agent: navigator.userAgent,
      screen_resolution: window.screen.width + 'x' + window.screen.height,
      viewport_size: window.innerWidth + 'x' + window.innerHeight,
      
      // Content metadata
      content_type: getContentType(),
      subject: getSubjectFromPage(),
      semester: getSemesterFromPage(),
      year: getYearFromPage(),
      branch: getBranchFromPage(),
      
      timestamp: new Date().toISOString()
    });

    // Also send to server-side endpoint
    sendPageViewToServer();
  }

  function getPageCategory() {
    const path = window.location.pathname;
    if (path === '/' || path === '/index.html') return 'home';
    if (path.includes('/dashboard') || path.includes('/index')) return 'dashboard';
    if (path.includes('/search') || path.includes('/browse')) return 'search';
    if (path.includes('/resource')) return 'resource';
    if (path.includes('/upload')) return 'upload';
    if (path.includes('/profile') || path.includes('/account')) return 'profile';
    if (path.includes('/subject')) return 'subject';
    if (path.includes('/college')) return 'college';
    if (path.includes('/chat')) return 'chat';
    if (path.includes('/login') || path.includes('/signup')) return 'auth';
    return 'general';
  }

  function getContentType() {
    const path = window.location.pathname;
    if (path.includes('/notes')) return 'notes';
    if (path.includes('/pyq') || path.includes('/papers')) return 'pyq';
    if (path.includes('/practicals')) return 'practicals';
    if (path.includes('/resource')) return 'resource';
    return 'unknown';
  }

  function getSubjectFromPage() {
    const titleMatch = document.title.match(/(\w+)\s*-\s*(SE|FE|TE|BE)/i);
    if (titleMatch) return titleMatch[1];
    
    const path = window.location.pathname;
    const parts = path.split('/');
    if (parts.length > 2 && parts[1] === 'subject') {
      return parts[2].replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }
    return '';
  }

  function getSemesterFromPage() {
    const titleMatch = document.title.match(/(SE|FE|TE|BE)/i);
    if (titleMatch) {
      const semesterMap = { 'SE': '1-2', 'FE': '3-4', 'TE': '5-6', 'BE': '7-8' };
      return semesterMap[titleMatch[1].toUpperCase()] || '';
    }
    return '';
  }

  function getYearFromPage() {
    const titleMatch = document.title.match(/(SE|FE|TE|BE)/i);
    if (titleMatch) {
      const yearMap = { 'SE': '1st Year', 'FE': '2nd Year', 'TE': '3rd Year', 'BE': '4th Year' };
      return yearMap[titleMatch[1].toUpperCase()] || '';
    }
    return '';
  }

  function getBranchFromPage() {
    const profile = window.ABHIHUB_USER_PROFILE || {};
    return profile.branch || '';
  }

  function trackPagePerformance() {
    if (window.performance && window.performance.timing) {
      const timing = window.performance.timing;
      const pageLoadTime = timing.loadEventEnd - timing.navigationStart;
      const domContentLoadedTime = timing.domContentLoadedEventEnd - timing.navigationStart;
      const timeToFirstByte = timing.responseStart - timing.navigationStart;

      window.gtag('event', 'page_performance', {
        page_load_time_ms: pageLoadTime,
        dom_content_loaded_ms: domContentLoadedTime,
        time_to_first_byte_ms: timeToFirstByte,
        page_path: window.location.pathname,
        device_type: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
      });
    }
  }

  // ── Server-side pageview logging ──
  function sendPageViewToServer() {
    if (window.__ABHIHUB_ANALYTICS_DISABLED__) return;
    
    fetch('/api/analytics/pageview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        page_path: window.location.pathname,
        page_title: document.title,
        page_location: window.location.href,
        page_category: getPageCategory(),
        referrer: document.referrer,
        session_id: window.ABHIHUB_SESSION_ID
      })
    }).catch(e => console.warn('[GA4] Server pageview failed:', e));
  }

  // ── User Properties Update (called when profile changes) ──
  function updateUserProperties(newProfile) {
    if (window.__ABHIHUB_ANALYTICS_DISABLED__) return;
    if (!window.gtag || typeof window.gtag !== 'function') return;
    
    // NOTE: Do NOT send PII (email, mobile) to GA4 per Google ToS
    window.gtag('set', { user_id: newProfile.userId || 'anonymous' });
    window.gtag('set', {
      user_properties: {
        user_type: newProfile.isAuthenticated ? 'authenticated' : 'anonymous',
        user_id: newProfile.userId || 'anonymous',
        user_name: newProfile.name || '',
        user_college: newProfile.college || '',
        user_branch: newProfile.branch || '',
        user_year_of_study: newProfile.yearOfStudy || '',
        user_role: newProfile.role || 'anonymous'
      }
    });
    
    console.log('[GA4] User properties updated:', newProfile);
  }

  // ── Session Duration Tracking ──
  let sessionEndHandled = false;

  function sendSessionEnd() {
    if (sessionEndHandled) return;
    sessionEndHandled = true;
    
    if (window.__ABHIHUB_ANALYTICS_DISABLED__) return;
    
    const sessionDuration = Math.floor((Date.now() - window.ABHIHUB_SESSION_START) / 1000);
    
    window.gtag('event', 'session_end', {
      session_id: window.ABHIHUB_SESSION_ID,
      session_duration_seconds: sessionDuration,
      session_page_views: window.ABHIHUB_PAGE_VIEWS,
      session_file_views: window.ABHIHUB_FILE_VIEWS,
      session_downloads: window.ABHIHUB_DOWNLOADS,
      session_searches: window.ABHIHUB_SEARCHES,
      engagement_quality: calculateEngagementQuality(),
      exit_page: window.location.pathname,
      timestamp: new Date().toISOString()
    });

    // Use sendBeacon for reliable delivery on page unload (works even if browser is closing)
    // Fall back to fetch if sendBeacon is not available
    const sessionData = JSON.stringify({
      session_id: window.ABHIHUB_SESSION_ID,
      session_duration_seconds: sessionDuration,
      page_views: window.ABHIHUB_PAGE_VIEWS,
      file_views: window.ABHIHUB_FILE_VIEWS,
      downloads: window.ABHIHUB_DOWNLOADS,
      searches: window.ABHIHUB_SEARCHES,
      engagement_quality: calculateEngagementQuality(),
      exit_page: window.location.pathname
    });

    if (navigator.sendBeacon) {
      // sendBeacon is more reliable on page unload - it doesn't get cancelled
      const blob = new Blob([sessionData], { type: 'application/json' });
      navigator.sendBeacon('/api/analytics/session-end', blob);
    } else {
      // Fallback to fetch for older browsers
      fetch('/api/analytics/session-end', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: sessionData,
        keepalive: true  // Keep connection alive during unload
      }).catch(e => console.warn('[GA4] Session end failed:', e));
    }
  }

  function calculateEngagementQuality() {
    const duration = (Date.now() - window.ABHIHUB_SESSION_START) / 1000 / 60; // minutes
    const score = Math.min(
      (duration / 10 * 30) + // up to 30 for 10+ min
      (window.ABHIHUB_PAGE_VIEWS * 10) + // up to 30 for 3+ pages
      (window.ABHIHUB_FILE_VIEWS * 10) + // up to 20 for 2+ files
      (window.ABHIHUB_DOWNLOADS > 0 ? 10 : 0) + // 10 for download
      (window.ABHIHUB_SEARCHES > 0 ? 10 : 0), // 10 for search
      100
    );
    
    if (score >= 75) return 'high';
    if (score >= 40) return 'medium';
    return 'low';
  }

  // Track session end on page unload
  window.addEventListener('beforeunload', sendSessionEnd);
  
  // Track session end on tab visibility change (user switches tabs)
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      sendSessionEnd();
    }
  });

  // ── File Stay Time Tracking ──
  function trackFileOpen(fileName, fileType, fileId, subject, college, branch, year) {
    if (window.__ABHIHUB_ANALYTICS_DISABLED__) return;
    
    window.ABHIHUB_CURRENT_FILE = {
      name: fileName,
      type: fileType,
      id: fileId,
      subject: subject,
      college: college,
      branch: branch,
      year: year
    };
    window.ABHIHUB_FILE_OPEN_TIME = Date.now();
    window.ABHIHUB_FILE_VIEWS++;
  }

  function trackFileClose() {
    if (window.__ABHIHUB_ANALYTICS_DISABLED__) return;
    if (!window.ABHIHUB_CURRENT_FILE) return;
    
    const timeSpent = Math.floor((Date.now() - window.ABHIHUB_FILE_OPEN_TIME) / 1000);
    const file = window.ABHIHUB_CURRENT_FILE;
    
    window.gtag('event', 'file_view', {
      file_name: file.name,
      file_type: file.type,
      document_id: file.id,
      subject: file.subject,
      college: file.college,
      branch: file.branch,
      year: file.year,
      time_spent_seconds: timeSpent,
      session_file_views: window.ABHIHUB_FILE_VIEWS,
      session_duration_seconds: Math.floor((Date.now() - window.ABHIHUB_SESSION_START) / 1000),
      engagement_quality: calculateEngagementQuality(),
      // NO PII - use user_id only per GA4 ToS
      user_id: window.ABHIHUB_USER_PROFILE.userId || 'anonymous',
      user_college: window.ABHIHUB_USER_PROFILE.college || '',
      user_branch: window.ABHIHUB_USER_PROFILE.branch || '',
      user_year_of_study: window.ABHIHUB_USER_PROFILE.yearOfStudy || '',
      page_path: window.location.pathname,
      timestamp: new Date().toISOString()
    });

    // GA4 Ecommerce: view_item
    window.gtag('event', 'view_item', {
      items: [{
        item_id: 'file_' + (file.id || file.name).replace(/[^a-zA-Z0-9]/g, '_'),
        item_name: file.name,
        item_category: file.type,
        item_category2: file.subject,
        item_category3: file.branch,
        item_variant: file.year,
        price: 0,
        quantity: 1
      }]
    });

    // Send to server
    fetch('/api/analytics/file-access', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        document_id: file.id,
        file_name: file.name,
        file_type: file.type,
        subject: file.subject,
        college: file.college,
        branch: file.branch,
        year: file.year,
        time_spent_seconds: timeSpent,
        action: 'view',
        session_id: window.ABHIHUB_SESSION_ID
      })
    }).catch(e => console.warn('[GA4] File access log failed:', e));

    console.log('[GA4] File viewed:', file.name, '| Time:', timeSpent + 's');
    
    window.ABHIHUB_CURRENT_FILE = null;
    window.ABHIHUB_FILE_OPEN_TIME = 0;
  }

  // ── Throttle helper ──
  window.gaThrottle = function(fn, limit) {
    var inThrottle;
    return function() {
      var args = arguments, context = this;
      if (!inThrottle) {
        fn.apply(context, args);
        inThrottle = true;
        setTimeout(function() { inThrottle = false; }, limit);
      }
    };
  };

  // ── Safe gtag wrapper ──
  function safeGtag() {
    if (typeof window.gtag === 'function') {
      window.gtag.apply(window, arguments);
    }
  }

  // ==========================================
  // FILE INTERACTION TRACKING
  // ==========================================
  window.AbhiHubTracking = {
    // Track PDF/File View (Enhanced with Ecommerce, Throttled)
    trackFileView: window.gaThrottle(function (fileName, fileType, fileId, subject, college, branch, year) {
      trackFileOpen(fileName, fileType, fileId, subject, college, branch, year);
      
      const profile = window.ABHIHUB_USER_PROFILE || {};
      const metadata = getContentMetadata();
      const sizeBucket = getFileSizeBucket(0);

      safeGtag('event', 'file_view', {
        'file_name': fileName,
        'file_type': fileType || 'unknown',
        'document_id': fileId || '',
        'subject': subject || metadata.subject,
        'college': college || profile.college,
        'branch': branch || profile.branch,
        'year': year || metadata.year,
        'file_size_kb': 0,
        'file_size_bucket': sizeBucket,
        'content_type': metadata.content_type,
        'semester': metadata.semester,
        'user_cohort': getUserCohort(),
        'engagement_quality': calculateEngagementQuality(),
        'session_quality_score': calculateSessionQuality(),
        'page_path': window.location.pathname,
        'timestamp': new Date().toISOString(),
        // NO PII - use user_id only per GA4 ToS
        'user_id': profile.userId || 'anonymous',
        'user_name': profile.name || '',
        'user_college': profile.college || '',
        'user_branch': profile.branch || '',
        'user_year_of_study': profile.yearOfStudy || ''
      });

      safeGtag('event', 'view_item', {
        'items': [{
          'item_id': 'file_' + (fileName || 'unknown').replace(/[^a-zA-Z0-9]/g, '_'),
          'item_name': fileName,
          'item_category': metadata.content_type,
          'item_category2': subject || metadata.subject,
          'item_category3': branch || profile.branch,
          'item_variant': fileType || 'unknown',
          'item_brand': year || metadata.year,
          'price': 0,
          'quantity': 1
        }]
      });

      console.log('[GA4] File viewed:', fileName);
    }, 2000),

    // Track File Close (with stay time)
    trackFileClose: function () {
      trackFileClose();
    },

    // Track File Download (Enhanced with Ecommerce)
    trackFileDownload: function (fileName, fileType, fileId, subject, college, branch, year) {
      if (window.__ABHIHUB_ANALYTICS_DISABLED__) return;
      
      window.ABHIHUB_DOWNLOADS++;
      
      const profile = window.ABHIHUB_USER_PROFILE || {};
      const metadata = getContentMetadata();
      const sizeBucket = getFileSizeBucket(0);

      safeGtag('event', 'file_download', {
        'file_name': fileName,
        'file_type': fileType || 'unknown',
        'document_id': fileId || '',
        'subject': subject || metadata.subject,
        'college': college || profile.college,
        'branch': branch || profile.branch,
        'year': year || metadata.year,
        'file_size_bucket': sizeBucket,
        'content_type': metadata.content_type,
        'user_cohort': getUserCohort(),
        'engagement_quality': calculateEngagementQuality(),
        'session_downloads': window.ABHIHUB_DOWNLOADS,
        'page_path': window.location.pathname,
        'timestamp': new Date().toISOString(),
        // NO PII - use user_id only per GA4 ToS
        'user_id': profile.userId || 'anonymous',
        'user_name': profile.name || '',
        'user_college': profile.college || '',
        'user_branch': profile.branch || '',
        'user_year_of_study': profile.yearOfStudy || ''
      });

      safeGtag('event', 'select_content', {
        'content_type': 'file',
        'item_id': 'file_' + (fileName || 'unknown').replace(/[^a-zA-Z0-9]/g, '_'),
        'content_id': fileName,
        'items': [{
          'item_id': 'file_' + (fileName || 'unknown').replace(/[^a-zA-Z0-9]/g, '_'),
          'item_name': fileName,
          'item_category': metadata.content_type,
          'item_category2': subject || metadata.subject,
          'item_variant': fileType,
          'price': 0,
          'quantity': 1
        }]
      });

      console.log('[GA4] Download:', fileName);
    },

    // Track File Search/Filter (Enhanced)
    trackSearch: function (searchQuery, resultCount, searchType, refinementLevel) {
      if (window.__ABHIHUB_ANALYTICS_DISABLED__) return;
      
      window.ABHIHUB_SEARCHES++;
      
      const isZeroResults = resultCount === 0;

      safeGtag('event', 'search', {
        'search_term': searchQuery,
        'search_type': searchType || 'general',
        'result_count': resultCount || 0,
        'search_refinement_level': refinementLevel || 0,
        'zero_results': isZeroResults,
        'user_cohort': getUserCohort(),
        'session_searches': window.ABHIHUB_SEARCHES,
        'page_path': window.location.pathname,
        'timestamp': new Date().toISOString(),
        'user_id': window.ABHIHUB_USER_PROFILE.userId || 'anonymous',
        'user_college': window.ABHIHUB_USER_PROFILE.college || '',
        'user_branch': window.ABHIHUB_USER_PROFILE.branch || ''
      });

      console.log('[GA4] Search:', searchQuery, '| Results:', resultCount, isZeroResults ? '(ZERO)' : '');
    },

    // Track Subject Click/Browse
    trackSubjectAccess: function (subjectName, contentType, college, branch) {
      if (window.__ABHIHUB_ANALYTICS_DISABLED__) return;
      
      const profile = window.ABHIHUB_USER_PROFILE || {};
      safeGtag('event', 'subject_access', {
        'subject_name': subjectName,
        'content_type': contentType || 'notes',
        'college': college || profile.college,
        'branch': branch || profile.branch,
        'user_id': profile.userId || 'anonymous',
        'page_path': window.location.pathname,
        'timestamp': new Date().toISOString()
      });
      console.log('[GA4] Subject accessed:', subjectName);

  // ==========================================
  // HELPER FUNCTIONS
  // ==========================================

  function getContentMetadata() {
    const path = window.location.pathname;
    const metadata = {
      content_type: 'unknown',
      subject: 'unknown',
      semester: 'unknown',
      year: 'unknown',
      branch: 'unknown'
    };

    if (path.includes('/notes')) metadata.content_type = 'notes';
    else if (path.includes('/pyq') || path.includes('/papers')) metadata.content_type = 'pyq';
    else if (path.includes('/practicals')) metadata.content_type = 'practicals';

    const titleMatch = document.title.match(/(\w+)\s*-\s*(SE|FE|TE|BE)/i);
    if (titleMatch) {
      metadata.subject = titleMatch[1];
      metadata.year = titleMatch[2].toUpperCase();
    }

    const profile = window.ABHIHUB_USER_PROFILE || {};
    metadata.branch = profile.branch || '';

    return metadata;
  }

  function getFileSizeBucket(sizeKB) {
    if (sizeKB < 1024) return 'small';
    if (sizeKB < 5120) return 'medium';
    return 'large';
  }

  function getUserCohort() {
    const regDate = localStorage.getItem('registration_date');
    if (!regDate) return 'unknown';

    const daysSince = Math.floor((Date.now() - new Date(regDate)) / (1000 * 60 * 60 * 24));
    const weeksSince = Math.floor(daysSince / 7);

    if (weeksSince === 0) return 'week_0';
    if (weeksSince <= 1) return 'week_1';
    if (weeksSince <= 4) return 'week_2-4';
    if (weeksSince <= 12) return 'month_1-3';
    return 'month_3plus';
  }

  function calculateSessionQuality() {
    const timeOnSite = (Date.now() - window.ABHIHUB_SESSION_START) / 1000 / 60;

    let score = 0;
    score += Math.min(timeOnSite / 3 * 20, 20);
    score += Math.min(window.ABHIHUB_PAGE_VIEWS * 10, 30);
    score += Math.min(window.ABHIHUB_DOWNLOADS * 15, 30);
    score += window.ABHIHUB_SEARCHES > 0 ? 10 : 0;
    score += window.ABHIHUB_FILE_VIEWS > 2 ? 10 : 0;

    return Math.min(Math.round(score), 100);
  }

  function getEngagementQuality() {
    const score = calculateSessionQuality();
    if (score >= 75) return 'high';
    if (score >= 40) return 'medium';
    return 'low';
  }

  function getScrollPercentage() {
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    if (scrollHeight === 0) return 0;
    return Math.round((scrollTop / scrollHeight) * 100);
  }

  // ==========================================
  // INITIALIZE
  // ==========================================

  if (!getConsentChoice()) {
    window.__ABHIHUB_ANALYTICS_DISABLED__ = true;
    document.addEventListener('DOMContentLoaded', ensureConsentBanner);
  } else {
    initializeAnalytics();
  }

  // Push enhanced data layer on page load
  window.dataLayer.push({
    'event': 'enhanced_page_data',
    'page_metadata': getContentMetadata(),
    'user_cohort': getUserCohort(),
    'session_id': window.ABHIHUB_SESSION_ID,
    'platform': /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
    'user_profile': window.ABHIHUB_USER_PROFILE
  });
