<style>
    /* Game Container */
    .dino-game-container {
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        margin: 20px auto;
        width: 100%;
        max-width: 600px;
        position: relative;
        overflow: hidden;
        background-color: #87CEEB;
        /* Sky Blue */
        border-radius: 8px;
        padding: 10px;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        border: 4px solid #4a3b2a;
    }

    #gameCanvas {
        background-color: transparent;
        display: block;
        margin: 0 auto;
    }

    .game-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #fff;
        display: none;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        text-shadow: 2px 2px 0 #000;
        border: 2px solid #fff;
        z-index: 10;
        width: 80%;
    }

    .score-display {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 20px;
        color: #fff;
        font-weight: bold;
        text-shadow: 2px 2px 0 #000;
        font-family: 'Impact', 'Arial Black', sans-serif;
        letter-spacing: 1px;
    }

    .controls-hint {
        color: #fff;
        font-size: 14px;
        margin-top: 10px;
        text-shadow: 1px 1px 0 #000;
        font-weight: bold;
    }

    /* Mobile controls */
    .mobile-controls {
        display: none;
        margin-top: 15px;
    }

    @media (pointer: coarse) {
        .mobile-controls {
            display: block;
        }

        .controls-hint {
            display: none;
        }
    }

    .jump-btn {
        background: #ff3333;
        color: white;
        border: 2px solid #fff;
        padding: 12px 30px;
        border-radius: 25px;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        text-transform: uppercase;
        font-family: 'Impact', sans-serif;
        letter-spacing: 1px;
    }
</style>

<div class="dino-game-container">
    <canvas id="gameCanvas" width="600" height="200"></canvas>
    <div class="score-display">MARIO SCORE: <span id="score">0</span></div>
    <div class="game-message" id="gameMessage">
        <p style="font-size: 32px; margin-bottom: 10px; color: #ff3333; font-family: Impact;">nana chi tang</p>
        <p style="font-size: 16px;">Press Space / Tap to Restart</p>
    </div>
    <div class="controls-hint">Press Space to Jump</div>

    <div class="mobile-controls">
        <button class="jump-btn" id="mobileJumpBtn">JUMP!</button>
    </div>
</div>

<script>
    (function () {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const messageElement = document.getElementById('gameMessage');
        const mobileJumpBtn = document.getElementById('mobileJumpBtn');

        // Game Constants
        const GRAVITY = 0.6;
        const JUMP_FORCE = -11;
        const GROUND_Y = 140; // Raised to make ground visible
        const MARIO_WIDTH = 30;
        const MARIO_HEIGHT = 40;

        // Colors
        const C_SKY = '#87CEEB';
        const C_GROUND = '#5C94FC'; // Classic Mario Ground Blue-ish or plain brick color
        const C_BRICK = '#B85C38';

        // Game State
        let gameRunning = false;
        let gameSpeed = 5;
        let score = 0;
        let frames = 0;
        let obstacles = [];
        let animationId;
        let groundOffset = 0;
        let jumpTextTimer = 0;
        let nextSpawnFrame = 0;

        // Mario Object
        const mario = {
            x: 50,
            y: GROUND_Y,
            dy: 0,
            width: MARIO_WIDTH,
            height: MARIO_HEIGHT,
            grounded: true,

            draw: function () {
                // Pixel Art Style Mario (Simplified)
                const x = this.x;
                const y = this.y;

                // Color Palette
                const red = '#FF0000';
                const blue = '#0000FF';
                const skin = '#FFCC99';
                const brown = '#663300';

                // Hat
                ctx.fillStyle = red;
                ctx.fillRect(x, y, 30, 8);
                ctx.fillRect(x + 10, y + 8, 20, 2); // Brim

                // Face
                ctx.fillStyle = skin;
                ctx.fillRect(x + 5, y + 8, 20, 10);

                // Mustache
                ctx.fillStyle = '#000';
                ctx.fillRect(x + 18, y + 14, 8, 2);
                ctx.fillRect(x + 16, y + 16, 4, 2); // Nose/Mustache

                // Shirt/Body
                ctx.fillStyle = red;
                ctx.fillRect(x + 5, y + 18, 20, 12);

                // Overalls
                ctx.fillStyle = blue;
                ctx.fillRect(x + 5, y + 25, 20, 10);
                // Straps
                ctx.fillRect(x + 5, y + 18, 4, 8);
                ctx.fillRect(x + 21, y + 18, 4, 8);

                // Arms (moving)
                ctx.fillStyle = red;
                if (this.grounded) {
                    // Swing arms
                    if (Math.floor(frames / 10) % 2 === 0) {
                        ctx.fillRect(x - 4, y + 20, 8, 8); // Left back
                        ctx.fillRect(x + 22, y + 20, 8, 8); // Right fwd
                    } else {
                        ctx.fillRect(x, y + 20, 8, 8); // Left fwd
                        ctx.fillRect(x + 25, y + 20, 8, 8); // Right back
                    }
                } else {
                    // Jump pose
                    ctx.fillRect(x - 2, y + 15, 8, 8); // Arm up
                }

                // Boots
                ctx.fillStyle = brown;
                // Simple run animation
                if (this.grounded) {
                    if (Math.floor(frames / 8) % 2 === 0) {
                        ctx.fillRect(x + 2, y + 35, 10, 5); // Left
                        ctx.fillRect(x + 18, y + 35, 10, 5); // Right
                    } else {
                        ctx.fillRect(x - 2, y + 32, 10, 5); // Left up
                        ctx.fillRect(x + 22, y + 32, 10, 5); // Right up
                    }
                } else {
                    // Jump pose
                    ctx.fillRect(x + 5, y + 32, 10, 6);
                    ctx.fillRect(x + 20, y + 35, 8, 5);
                }

                // Draw Jump Text "AbhiHub"
                if (jumpTextTimer > 0) {
                    ctx.fillStyle = '#FFDD00'; // Gold
                    ctx.font = 'bold 16px Impact';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.shadowColor = '#000';
                    ctx.shadowBlur = 0;

                    const textY = this.y - 15 - (30 - jumpTextTimer); // Move up slightly
                    ctx.fillText("AbhiHub", this.x - 10, textY);
                    ctx.strokeText("AbhiHub", this.x - 10, textY);

                    jumpTextTimer--;
                }
            },

            jump: function () {
                if (this.grounded) {
                    this.dy = JUMP_FORCE;
                    this.grounded = false;
                    jumpTextTimer = 30; // Show text for ~30 frames
                }
            },

            update: function () {
                // Apply Gravity
                this.dy += GRAVITY;
                this.y += this.dy;

                // Ground Collision
                if (this.y > GROUND_Y) {
                    this.y = GROUND_Y;
                    this.dy = 0;
                    this.grounded = true;
                }

                this.draw();
            }
        };

        // Obstacle Class
        class Obstacle {
            constructor() {
                // 50% Chance of Tortoise ("Koopa") or Plant ("Piranha")
                this.type = Math.random() > 0.5 ? 'plant' : 'tortoise';

                if (this.type === 'plant') {
                    this.width = 30;
                    this.height = 45;
                } else {
                    this.width = 35;
                    this.height = 30; // Shorter
                }

                this.x = canvas.width;
                this.y = GROUND_Y + MARIO_HEIGHT - this.height;
                this.passed = false;

                // Animation offset
                this.frameOffset = Math.floor(Math.random() * 10);
            }

            draw() {
                const x = this.x;
                const y = this.y;

                if (this.type === 'plant') {
                    // Piranha Plant

                    // Pipe
                    ctx.fillStyle = '#00aa00'; // Dark Green Pipe
                    ctx.fillRect(x, y + 25, 30, 20); // Pipe Body
                    ctx.fillStyle = '#00dd00'; // Light Green Highlight
                    ctx.fillRect(x + 2, y + 25, 4, 20);
                    ctx.fillStyle = '#008800'; // Pipe Rim
                    ctx.fillRect(x - 2, y + 20, 34, 10);

                    // Head
                    ctx.fillStyle = '#FF0000'; // Red
                    // Open/Close mouth animation
                    let bite = (Math.floor((frames + this.frameOffset) / 15) % 2 === 0);

                    if (bite) {
                        // Closed
                        ctx.beginPath();
                        ctx.arc(x + 15, y + 10, 15, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // Open
                        ctx.beginPath();
                        ctx.arc(x + 15, y + 10, 15, 0.2, Math.PI * 1.8);
                        ctx.lineTo(x + 15, y + 10);
                        ctx.fill();
                    }

                    // Spots
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(x + 10, y + 5, 3, 0, Math.PI * 2);
                    ctx.fill();


                } else {
                    // Tortoise (Koopa Troopa)

                    // Shell
                    ctx.fillStyle = '#00AA00'; // Green Shell
                    ctx.beginPath();
                    ctx.ellipse(x + 17, y + 15, 12, 10, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Head
                    ctx.fillStyle = '#FFCC00'; // Yellow Skin
                    ctx.beginPath();
                    ctx.arc(x + 8, y + 10, 8, 0, Math.PI * 2);
                    ctx.fill();

                    // Eye
                    ctx.fillStyle = '#000';
                    ctx.fillRect(x + 4, y + 8, 2, 2);

                    // Legs - walking animation
                    ctx.fillStyle = '#FFCC00';
                    if (Math.floor((frames + this.frameOffset) / 10) % 2 === 0) {
                        ctx.fillRect(x + 10, y + 22, 6, 8); // Front leg
                        ctx.fillRect(x + 22, y + 22, 6, 8); // Back leg
                    } else {
                        ctx.fillRect(x + 6, y + 22, 6, 8); // Front leg move
                        ctx.fillRect(x + 26, y + 22, 6, 8); // Back leg move
                    }
                }
            }

            update() {
                this.x -= gameSpeed;
                this.draw();
            }
        }

        function drawGround() {
            // Ground starts at Mario's feet
            const groundY = GROUND_Y + MARIO_HEIGHT;

            // Draw Grass Top Layer
            ctx.fillStyle = '#32CD32'; // Lime Green
            ctx.fillRect(0, groundY, canvas.width, 20);

            // Draw Dirt Bottom Layer
            ctx.fillStyle = '#8B4513'; // Saddle Brown
            ctx.fillRect(0, groundY + 12, canvas.width, canvas.height - (groundY + 12));

            // Moving ground effect
            groundOffset = (groundOffset - gameSpeed) % 40;

            // Draw details
            for (let i = groundOffset - 40; i < canvas.width; i += 40) {
                // Grass pattern / highlights
                ctx.fillStyle = '#228B22'; // Forest Green
                ctx.fillRect(i + 5, groundY, 4, 10);
                ctx.fillRect(i + 20, groundY + 2, 4, 8);

                // Dirt specs
                ctx.fillStyle = '#A0522D'; // Sienna
                ctx.fillRect(i + 10, groundY + 16, 6, 4);
                ctx.fillRect(i + 30, groundY + 18, 4, 2);
            }

            // Top border line
            ctx.fillStyle = '#006400'; // DarkGreen
            ctx.fillRect(0, groundY, canvas.width, 2);
        }

        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            const cloudSpeed = gameSpeed * 0.2;
            const time = frames * cloudSpeed;

            let cx1 = (canvas.width - (time % (canvas.width + 100))) + 50;
            ctx.beginPath();
            ctx.arc(cx1, 50, 20, 0, Math.PI * 2);
            ctx.arc(cx1 + 25, 50, 25, 0, Math.PI * 2);
            ctx.arc(cx1 + 50, 50, 20, 0, Math.PI * 2);
            ctx.fill();

            let cx2 = (canvas.width - ((time + 300) % (canvas.width + 100)));
            ctx.beginPath();
            ctx.arc(cx2, 80, 15, 0, Math.PI * 2);
            ctx.arc(cx2 + 20, 80, 20, 0, Math.PI * 2);
            ctx.arc(cx2 + 40, 80, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function initGame() {
            gameRunning = true;
            score = 0;
            gameSpeed = 5;
            frames = 0;
            obstacles = [];
            mario.y = GROUND_Y;
            mario.dy = 0;
            mario.grounded = true;
            jumpTextTimer = 0;
            messageElement.style.display = 'none';
            scoreElement.textContent = score;
            nextSpawnFrame = 50; // Initial spawn delay
            loop();
        }

        function spawnObstacles() {
            // Improved Spawning Logic
            if (frames >= nextSpawnFrame) {
                obstacles.push(new Obstacle());

                // Calculate next spawn time
                // Random interval between 60 and 150 frames (approx 1-2.5 seconds)
                // Decreases as game speed increases to keep difficulty balanced but engaging
                const minDelay = 60;
                const maxDelay = 150 - (gameSpeed * 2);
                const delay = Math.floor(Math.random() * (maxDelay - minDelay + 1)) + minDelay;

                nextSpawnFrame = frames + delay;
            }

            // Basic difficulty increase
            if (frames % 500 === 0 && gameSpeed < 12) {
                gameSpeed += 0.5;
            }
        }

        function checkCollision() {
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                const hitboxPadding = 8;

                if (
                    mario.x + hitboxPadding < obs.x + obs.width &&
                    mario.x + mario.width - hitboxPadding > obs.x &&
                    mario.y + hitboxPadding < obs.y + obs.height &&
                    mario.y + mario.height > obs.y
                ) {
                    gameOver();
                }
            }
        }

        function updateScore() {
            frames++;
            if (frames % 10 === 0) {
                score++;
                scoreElement.textContent = score;
            }
        }

        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            messageElement.style.display = 'block';
        }

        function loop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawClouds();
            drawGround();

            spawnObstacles();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            mario.update();

            checkCollision();
            updateScore();

            if (gameRunning) {
                animationId = requestAnimationFrame(loop);
            }
        }

        function handleInput(e) {
            if ((e.code === 'Space' || e.code === 'ArrowUp') && gameRunning) {
                e.preventDefault();
                mario.jump();
            }
            if ((e.code === 'Space' || e.code === 'ArrowUp') && !gameRunning) {
                e.preventDefault();
                initGame();
            }
        }

        function handleTouch(e) {
            if (e.target.closest('.jump-btn') || e.target.closest('canvas')) {
                e.preventDefault();
                if (gameRunning) {
                    mario.jump();
                } else {
                    initGame();
                }
            }
        }

        document.addEventListener('keydown', handleInput);
        mobileJumpBtn.addEventListener('touchstart', handleTouch);
        mobileJumpBtn.addEventListener('click', handleTouch);
        canvas.addEventListener('touchstart', handleTouch);

        // Initial Draw
        drawClouds();
        drawGround();
        mario.draw();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Courier New';
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 3;
        ctx.strokeText("PRESS SPACE TO START", 180, 100);
        ctx.fillText("PRESS SPACE TO START", 180, 100);

    })();
</script>
