<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Instant Theme Detection & Application (prevents theme flash in PWA/Shell) -->
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('abhihub_theme') || 'system';
                var isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            } catch(e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AbhiHub">
    <meta name="mobile-web-app-capable" content="yes">

    <title>AbhiHub</title>

    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/android-chrome-192x192.png">

    <!-- Fonts & Tokens -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pipeline/01_tokens.css') }}?v=2026">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pipeline/02_base.css') }}?v=2026">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pipeline/navbar.css') }}?v=2026">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pipeline/notification-bell.css') }}?v=2026">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-shell-frame.css') }}?v=2026">
    <style>
        /* Critical responsive layout guards for Shell */
        .shell-desktop-nav { display: none !important; }
        @media (min-width: 860px) {
            .shell-desktop-nav { display: flex !important; }
            #shellBottomNav { display: none !important; }
        }
    </style>
</head>
<body class="app-shell-body">

    <div class="app-shell-viewport">

        <!-- Shell Header / Top Bar -->
        <header id="shellHeader" class="shell-header">
            <div class="shell-header-left">
                <!-- Back Button for Inner Pages -->
                <button type="button" id="shellBackBtn" class="shell-back-btn" aria-label="Go Back">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>

                <!-- Brand Logo (visible on main tabs) -->
                <a href="/dashboard" id="shellBrandLink" class="shell-brand-link">
                    <span class="shell-logo-text kanit-bold">AbhiHub</span>
                </a>

                <!-- Dynamic Page Title (visible on sub-pages) -->
                <span id="shellPageTitle" class="shell-page-title kanit-medium">AbhiHub</span>
            </div>

            <!-- Desktop Nav Items (visible on >= 860px) -->
            <nav id="shellDesktopNav" class="shell-desktop-nav" aria-label="Primary Desktop Navigation">
                <a href="/dashboard" class="shell-nav-link shell-nav-link--active" data-page="home">Home</a>
                <a href="/upload" class="shell-nav-link" data-page="upload">Upload</a>
                <a href="/leaderboard" class="shell-nav-link" data-page="ranking">Ranking</a>
                <a href="/settings" class="shell-nav-link" data-page="settings">Settings</a>
                <a href="/store-room" class="shell-nav-link" data-page="store-room">Store Room</a>
            </nav>

            <div class="shell-header-right">
                <!-- Theme Switcher Button -->
                <button type="button" id="shellThemeToggle" class="shell-theme-btn" aria-label="Toggle theme" title="Switch dark/light mode">
                    <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <!-- Shell Notification Bell -->
                <div id="shellNotifWrap" class="shell-notif-wrap">
                    <button type="button" id="shellNotifBell" class="shell-notif-btn" aria-label="Notifications" aria-expanded="false">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                        </svg>
                        <span id="shellNotifBadge" class="shell-notif-badge"></span>
                    </button>

                    <!-- Notifications Dropdown Panel -->
                    <div id="shellNotifPanel" class="shell-notif-panel">
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border-light, #f1f5f9); background:rgba(37,99,235,0.03);">
                            <span style="font-weight:700; font-size:0.9rem;">🔔 Notifications</span>
                            <button type="button" data-action="markAllRead" style="background:none; border:none; color:#2563eb; font-size:0.8rem; font-weight:600; cursor:pointer;">Mark all read</button>
                        </div>
                        <div id="shellNotifList" style="max-height:360px; overflow-y:auto;">
                            <div class="notif-loading" style="padding:16px; text-align:center; color:#64748b;">Loading…</div>
                        </div>
                        <div style="padding:8px 14px; text-align:center; border-top:1px solid var(--border-light, #f1f5f9); background:var(--bg-secondary, #fafafa);">
                            <a href="/notifications" class="navbar__item" style="font-size:0.8rem; color:#2563eb; font-weight:600; text-decoration:none;">View All Notifications</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area: Iframes & Fullscreen Loader -->
        <main id="shellMainArea" class="shell-main-area">

            <!-- Fullscreen App Loader -->
            <div id="shellLoader" class="shell-loader">
                <img src="/static/images/android-chrome-192x192.png" alt="AbhiHub" class="shell-loader-icon">
                <div class="shell-spinner"></div>
                <div id="shellSlowMsg" class="shell-slow-msg">
                    <p style="margin:0 0 8px 0; font-weight:500;">Connection is taking longer than usual…</p>
                    <div class="shell-slow-actions">
                        <button type="button" id="shellRetryBtn" class="shell-btn-sm primary">Retry</button>
                        <button type="button" id="shellHomeFallbackBtn" class="shell-btn-sm">Go to Home</button>
                    </div>
                </div>
            </div>

            <!-- Single Main Iframe for Navigation -->
            <iframe id="shellIframe" name="abhihub-shell" class="shell-iframe" src="{{ initial_path | default('/dashboard') }}" title="AbhiHub Content" allow="camera; microphone; clipboard-write"></iframe>

            <!-- Keep-Alive Iframe for Upload (Never cancelled on tab switch) -->
            <iframe id="shellIframeUpload" name="abhihub-shell" class="shell-iframe" src="about:blank" title="AbhiHub Upload" allow="camera; microphone; clipboard-write" style="display:none;"></iframe>

        </main>

        <!-- Bottom Navigation Bar (exact match with p_nav.html) -->
        <nav id="shellBottomNav" class="navbar navbar--bottom" role="navigation" aria-label="Main">
            <a href="/dashboard" class="navbar__item -blue navbar__item--active" data-page="home">
                <span class="navbar__icon" aria-hidden="true">
                    <svg class="icon"><use xlink:href="#icon-home"></use></svg>
                </span>
                <span class="navbar__label">Home</span>
            </a>

            <a href="/upload" class="navbar__item -yellow" data-page="upload">
                <span class="navbar__icon" aria-hidden="true">
                    <svg class="icon"><use xlink:href="#icon-upload"></use></svg>
                </span>
                <span class="navbar__label">Upload</span>
            </a>

            <a href="/leaderboard" class="navbar__item -orange" data-page="ranking">
                <span class="navbar__icon" aria-hidden="true">
                    <svg class="icon"><use xlink:href="#icon-cup"></use></svg>
                </span>
                <span class="navbar__label">Ranking</span>
            </a>

            <a href="/settings" class="navbar__item -purple" data-page="settings">
                <span class="navbar__icon" aria-hidden="true">
                    <svg class="icon"><use xlink:href="#icon-settings"></use></svg>
                </span>
                <span class="navbar__label">Settings</span>
            </a>

            <a href="/store-room" class="navbar__item -green" data-page="store-room">
                <span class="navbar__icon" aria-hidden="true">
                    <svg class="icon"><use xlink:href="#icon-folder"></use></svg>
                </span>
                <span class="navbar__label">Store Room</span>
            </a>

            <a href="/admin/controle" id="shellAdminTab" class="navbar__item -red" data-page="admin" style="display: none;">
                <span class="navbar__icon" aria-hidden="true">
                    <svg class="icon"><use xlink:href="#icon-settings"></use></svg>
                </span>
                <span class="navbar__label">Admin</span>
            </a>
        </nav>

    </div>

    <!-- SVG Icon Definitions (reused from p_nav.html) -->
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

                <path d="M32 18.451l-16-12.42-16 12.42v-5.064l16-12.42 16 12.42zM28 18.029v12.994h-8v-8h-8v8h-8v-12.994l12-9.323z"></path>
            </symbol>
            <symbol id="icon-upload" viewBox="0 0 32 32">
                <title>upload</title>
                <path d="M26 18h-4v6h-12v-6h-4l10-10 10 10zM32 20v10h-32v-10h4v6h24v-6h4z"></path>
            </symbol>
            <symbol id="icon-cup" viewBox="0 0 32 32">
                <title>cup</title>
                <path d="M26 2h-20l-2 8c0 4.418 3.582 8 8 8h1.070c0.803 1.725 2.274 3.095 4.095 3.735l-1.165 4.265h-5.999v4h12v-4h-5.999l-1.165-4.265c1.821-0.64 3.292-2.010 4.095-3.735h1.070c4.418 0 8-3.582 8-8l-2-8zM6.168 8l0.999-4h3.832v6.621c-2.738-0.744-4.831-2.625-4.831-4.621zM20.999 10.621v-6.621h3.832l0.999 4c0 1.996-2.093 3.877-4.831 4.621z"></path>
            </symbol>
            <symbol id="icon-user" viewBox="0 0 32 32">
                <title>user</title>
                <path d="M18 22.082v-1.649c2.203-1.241 4-4.337 4-7.432 0-4.971 0-9-6-9s-6 4.029-6 9c0 3.096 1.797 6.191 4 7.432v1.649c-6.784 0.555-12 3.888-12 7.918h28c0-4.030-5.216-7.364-12-7.918z"></path>

            <symbol id="icon-settings" viewBox="0 0 32 32">

                <path d="M29.18 13.78l-2.45-0.41c-0.2-0.7-0.49-1.37-0.85-2l1.52-1.97c0.41-0.53 0.35-1.28-0.14-1.77l-2.83-2.83c-0.49-0.49-1.24-0.55-1.77-0.14l-1.97 1.52c-0.63-0.36-1.3-0.65-2-0.85l-0.41-2.45c-0.11-0.65-0.67-1.13-1.33-1.13h-4c-0.66 0-1.22 0.48-1.33 1.13l-0.41 2.45c-0.7 0.2-1.37 0.49-2 0.85l-1.97-1.52c-0.53-0.41-1.28-0.35-1.77 0.14l-2.83 2.83c-0.49 0.49-0.55 1.24-0.14 1.77l1.52 1.97c-0.36 0.63-0.65 1.3-0.85 2l-2.45 0.41c-0.65 0.11-1.13 0.67-1.13 1.33v4c0 0.66 0.48 1.22 1.13 1.33l2.45 0.41c0.2 0.7 0.49 1.37 0.85 2l-1.52 1.97c-0.41 0.53-0.35 1.28 0.14 1.77l2.83 2.83c0.49 0.49 1.24 0.55 1.77 0.14l1.97-1.52c0.63 0.36 1.3 0.65 2 0.85l0.41 2.45c0.11 0.65 0.67 1.13 1.33 1.13h4c0.66 0 1.22-0.48 1.33-1.13l0.41-2.45c0.7-0.2 1.37-0.49 2-0.85l1.97 1.52c0.53 0.41 1.28 0.35 1.77-0.14l2.83-2.83c0.49-0.49 0.55-1.24 0.14-1.77l-1.52-1.97c0.36-0.63 0.65-1.3 0.85-2l2.45-0.41c0.65-0.11 1.13-0.67 1.13-1.33v-4c0-0.66-0.48-1.22-1.13-1.33zM16 21c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"></path>
            </symbol>
        </defs>
    </svg>

    <!-- Persistent Global Tarika AI Assistant (Lives outside iframe across all tab & document transitions) -->
    {% include 'includes/ai_assistant.html' %}

    <!-- Shell Controller Script -->
    <script src="{{ url_for('static', filename='js/app-shell.js') }}?v=2026" defer></script>
</body>
</html>
