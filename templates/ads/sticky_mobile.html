{# 
  Mobile Sticky Anchor Ad — sits above the bottom nav bar (AdSense compliant)
  Usage: Place right before </body> in the app shell.
  AdSense policy: ≥150px clear gap from all navigation elements.
#}
<div class="ad-sticky-wrapper" id="adSticky">
  <div class="ad-sticky-header">
      <span class="ad-sticky-label">Advertisement</span>
      <button class="ad-sticky-close" id="adStickyClose" aria-label="Close Ad">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </button>
  </div>
  <div class="ad-sticky-content">
      <!-- Replace with real AdSense ins tag when approved -->
      <img src="{{ url_for('static', filename='images/apple-touch-icon.png') }}" 
           alt="Advertisement" 
           style="width:auto; height:50px; opacity: 0.5;">
  </div>
</div>

<style>
.ad-sticky-wrapper {
    position: fixed;
    bottom: 110px !important;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 400px;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    z-index: 990;
    border: 1px solid rgba(0,0,0,0.08);
    overflow: hidden;
    transition: all 0.25s ease;
}
[data-theme="dark"] .ad-sticky-wrapper {
    background: rgba(20, 20, 24, 0.92);
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: 0 12px 36px rgba(0,0,0,0.55);
}
.ad-sticky-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.02);
    border-bottom: 1px solid rgba(0,0,0,0.06);
}
[data-theme="dark"] .ad-sticky-header {
    background: rgba(255, 255, 255, 0.03);
    border-bottom-color: rgba(255, 255, 255, 0.06);
}
.ad-sticky-label {
    font-size: 10px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.ad-sticky-close {
    background: none;
    border: none;
    color: #94a3b8;
    padding: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    /* Larger touch target — AdSense requires min 32x32px hit area */
    min-width: 32px;
    min-height: 32px;
}
.ad-sticky-close:hover { background: #f1f5f9; }
.ad-sticky-content {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60px;
    background: #fff;
    padding: 4px 0;
}

@media (min-width: 768px) {
    /* Hide on desktop */
    .ad-sticky-wrapper { display: none !important; }
}
</style>

<script>
(function() {
    var closeBtn = document.getElementById('adStickyClose');
    if (closeBtn) {
        closeBtn.addEventListener('click', function() {
            var el = document.getElementById('adSticky');
            if (el) el.style.display = 'none';
        });
    }
})();
</script>
