{% extends 'p_struct.html' %}
{% set disable_ads = true %}
{% block content %}

<style>
  .offline-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 180px);
    padding: 2rem;
    text-align: center;
  }

  .offline-icon {
    width: 120px;
    height: 120px;
    margin-bottom: 2rem;
    background: #F3F4F6;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .offline-icon svg {
    width: 64px;
    height: 64px;
    color: #6B7280;
  }

  .offline-title {
    font-size: 2rem;
    font-weight: 600;
    color: #1F2937;
    margin-bottom: 1rem;
  }

  .offline-message {
    font-size: 1.1rem;
    color: #6B7280;
    margin-bottom: 2rem;
    max-width: 500px;
  }

  .offline-actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .offline-button {
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: transform 0.2s;
    cursor: pointer;
  }

  .retry-btn {
    background: linear-gradient(90deg, #2563eb 60%, #1d4ed8 100%);
    color: white;
  }

  .cached-btn {
    background: #F3F4F6;
    color: #374151;
    border: 1px solid #D1D5DB;
  }

  .offline-button:hover {
    transform: translateY(-2px);
  }

  @media (max-width: 640px) {
    .offline-container {
      padding: 1rem;
    }

    .offline-icon {
      width: 90px;
      height: 90px;
    }

    .offline-icon svg {
      width: 48px;
      height: 48px;
    }

    .offline-title {
      font-size: 1.5rem;
    }
  }
</style>

<div class="offline-container">
  <div class="offline-icon">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.757-2.43">
      </path>
    </svg>
  </div>

  <h1 class="offline-title">You're Offline</h1>

  <p class="offline-message">
    It seems you've lost your internet connection. Don't worry - you can still access your cached content or try
    reconnecting.
  </p>

  {% include 'dino_game.html' %}

  <div class="offline-actions">
    <button class="offline-button retry-btn" onclick="retryConnection()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20"
        height="20">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
        </path>
      </svg>
      Try Again
    </button>

    <button class="offline-button cached-btn" onclick="showCachedContent()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20"
        height="20">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z">
        </path>
      </svg>
      View Cached Content
    </button>
  </div>
</div>

<script>
  function retryConnection() {
    window.location.reload();
  }

  function showCachedContent() {
    // Navigate to the last cached page or home
    window.history.back() || window.location.href = '/premium/';
  }

  // Check connection status
  window.addEventListener('online', () => {
    document.querySelector('.offline-title').textContent = "You're Back Online!";
    document.querySelector('.offline-message').textContent =
      "Your connection has been restored. You can continue browsing.";

    setTimeout(() => {
      window.location.reload();
    }, 1500);
  });
</script>

{% endblock %}
