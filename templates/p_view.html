{% extends 'p_struct.html' %}
{% block content %}

<title>{{ file['file_name'] }} — AbhiHub Viewer</title>
<meta name="referrer" content="same-origin">
<style>
  .viewer-root {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--surface, #f8fafc);
    overflow: hidden;
  }
  .viewer-bar {
    flex-shrink: 0;
    height: 52px;
    background: var(--card, #fff);
    border-bottom: 1px solid var(--border, #e2e8f0);
    display: flex;
    align-items: center;
    padding: 0 1rem;
    gap: .75rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .viewer-back {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 10px;
    background: #dbeafe;
    color: #2563eb;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .18s, transform .18s;
    text-decoration: none;
  }
  .viewer-back:hover { background: #bfdbfe; transform: translateX(-2px); }
  .viewer-title {
    flex: 1; min-width: 0;
    font-weight: 600; font-size: .95rem;
    color: #1e293b;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .viewer-viewport {
    flex: 1; min-height: 0;
    position: relative; overflow: hidden;
    background: #e5e7eb;
  }
  .viewer-loading {
    position: absolute; inset: 0;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(4px);
    z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1rem;
    transition: opacity .3s;
  }
  .viewer-loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 42px; height: 42px;
    border: 3px solid #e2e8f0;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .loading-label { color: #64748b; font-size: .9rem; font-weight: 500; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* AdPlacement Banner */
  .ad-banner {
    background: var(--surface, #f8fafc);
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border, #e2e8f0);
    margin-bottom: 1rem;
  }
</style>

<div class="viewer-root" role="main" aria-label="Document viewer">

  <div class="viewer-bar" role="toolbar" aria-label="Document controls">
    <button class="viewer-back" type="button" onclick="history.back()" aria-label="Go back">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
    </button>
    <span class="viewer-title" title="{{ file['file_name'] }}">
      {{ file['file_name'] }}
    </span>
  </div>

  <!-- Ad Placement (Banner) -->
  <div class="ad-banner">
    {% include 'ads/banner.html' %}
  </div>

  <div class="viewer-viewport">
    <div class="viewer-loading" id="loadingOverlay" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <span class="loading-label">Preparing document…</span>
    </div>
  </div>

</div>

<script>
  (function initViewer() {
    const overlay  = document.getElementById('loadingOverlay');
    const viewport = document.querySelector('.viewer-viewport');
    const pdfUrl   = "{{ file['url'] }}";
    const pdfName  = "{{ file['file_name'] }}";

    function fitHeight() {
      const root = document.querySelector('.viewer-root');
      if (!root) return;
      const topHeader = document.querySelector('header.site-header')?.offsetHeight || 0;
      const adBanner  = document.querySelector('.ad-banner')?.offsetHeight || 0;
      const bottomNav = window.innerWidth < 768
        ? (document.getElementById('bottomNav')?.offsetHeight || 64)
        : 0;
      const avail = window.innerHeight - topHeader - adBanner - bottomNav - 2;
      root.style.height = Math.max(300, avail) + 'px';
    }
    fitHeight();
    window.addEventListener('resize', fitHeight);
    window.addEventListener('load', fitHeight);

    function mountPdfJs() {
      viewport.innerHTML =
        '<iframe id="pdfFrame" src="/static/pdfjs-6.1.200-dist/web/viewer.html?file=' +
          encodeURIComponent(pdfUrl) + '&download=false" ' +
          'style="border:none;display:block;width:100%;height:100%;background:#525659;" ' +
          'title="' + pdfName + '" ' +
          'onload="document.getElementById(\'loadingOverlay\').classList.add(\'hidden\');" ' +
          'onerror="document.getElementById(\'loadingOverlay\').classList.add(\'hidden\');">' +
        '</iframe>';
      setTimeout(function() {
        var frame = document.getElementById('pdfFrame');
        if (frame) frame.style.height = viewport.clientHeight + 'px';
      }, 50);
    }

    mountPdfJs();
  })();
</script>

{% endblock %}
