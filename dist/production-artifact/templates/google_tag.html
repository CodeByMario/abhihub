<!-- Google Analytics 4 — Consent Mode v2 (Privacy-Safe + Traffic Modelling) -->
<script>
  window.dataLayer = window.dataLayer || [];
  const CONSENT_KEY = 'abhihub-consent';
  const GA_MEASUREMENT_ID = 'G-EH5BGS9BEG';

  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = gtag;

  // ─── Consent Mode v2: Fire BEFORE gtag script loads ─────────────────────
  // 'denied' storage = cookieless traffic modelling (counts visitors even without opt-in)
  // 'granted' storage = full cookie-based analytics after explicit consent
  gtag('consent', 'default', {
    analytics_storage: 'denied',
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    wait_for_update: 500
  });
  // ─────────────────────────────────────────────────────────────────────────

  function getConsentChoice() {
    try {
      return localStorage.getItem(CONSENT_KEY) === 'granted';
    } catch (e) {
      return false;
    }
  }

  function setConsentChoice(granted) {
    try {
      localStorage.setItem(CONSENT_KEY, granted ? 'granted' : 'denied');
    } catch (e) { }

    // Upgrade or downgrade Consent Mode v2 signals immediately
    gtag('consent', 'update', {
      analytics_storage: granted ? 'granted' : 'denied',
      ad_storage: granted ? 'granted' : 'denied',
      ad_user_data: granted ? 'granted' : 'denied',
      ad_personalization: 'denied'   // Always off — no ad targeting on student platform
    });

    if (window.AbhiHubAnalytics) {
      window.AbhiHubAnalytics.track('consent_updated', { analytics_allowed: Boolean(granted) });
    }
    window.location.reload();
  }

  function ensureConsentBanner() {
    if (document.getElementById('abhihub-consent-banner')) return;
    const banner = document.createElement('div');
    banner.id = 'abhihub-consent-banner';
    banner.className = 'abhihub-consent-banner';
    banner.setAttribute('role', 'dialog');
    banner.setAttribute('aria-labelledby', 'consent-banner-title');
    banner.setAttribute('aria-describedby', 'consent-banner-copy');
    banner.innerHTML = '<div class="abhihub-consent-content"><strong id="consent-banner-title">Your privacy matters</strong><p id="consent-banner-copy">We use privacy-conscious analytics to improve study note quality and platform performance. <a href="/privacy">Read our privacy policy</a>.</p></div><div class="abhihub-consent-actions"><button type="button" data-consent="accept" class="abhihub-consent-btn abhihub-consent-btn--accept">Accept analytics</button><button type="button" data-consent="decline" class="abhihub-consent-btn abhihub-consent-btn--decline">Decline</button></div>';
    document.body.appendChild(banner);

    banner.querySelector('[data-consent="accept"]').addEventListener('click', function () {
      setConsentChoice(true);
    });
    banner.querySelector('[data-consent="decline"]').addEventListener('click', function () {
      setConsentChoice(false);
    });
  }

  window.AbhiHubConsent = {
    hasConsent: getConsentChoice,
    setConsent: setConsentChoice
  };

  // Server-injected profile (sanitized: NO email, NO mobile, NO passwords)
  window.ABHIHUB_USER_PROFILE = {{ user_profile_json | default(get_full_profile_json()) | tojson }};

  function initializeAnalytics() {
    const isLocal = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|.*\.local)$/.test(window.location.hostname);
    if (isLocal) {
      console.info('[Analytics] Local dev mode — GA4 hits silenced, consent mode v2 active.');
      return;
    }

    const gtagScript = document.createElement('script');
    gtagScript.async = true;
    gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID;
    document.head.appendChild(gtagScript);

    gtagScript.onload = function () {
      window.gtag('js', new Date());
      window.gtag('config', GA_MEASUREMENT_ID, {
        page_path: window.location.pathname,
        page_title: document.title,
        send_page_view: true,
        anonymize_ip: true,
        allow_google_signals: false,
        allow_ad_personalization_signals: false
      });

      const profile = window.ABHIHUB_USER_PROFILE || {};
      if (window.AbhiHubAnalytics) {
        window.AbhiHubAnalytics.setUser({
          userId: profile.userId || 'anonymous',
          role: profile.role || 'anonymous',
          college: profile.college || '',
          branch: profile.branch || '',
          yearOfStudy: profile.yearOfStudy || ''
        });
      }
    };
  }

  // Always initialize GA4 (Consent Mode v2 ensures cookieless modelling even before opt-in)
  initializeAnalytics();

  // Show consent banner only if user hasn't chosen yet
  try {
    if (localStorage.getItem(CONSENT_KEY) === null) {
      document.addEventListener('DOMContentLoaded', ensureConsentBanner);
    }
  } catch (e) {
    document.addEventListener('DOMContentLoaded', ensureConsentBanner);
  }
</script>
<style>
  .abhihub-consent-banner {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 16px max(24px, env(safe-area-inset-right)) 16px max(24px, env(safe-area-inset-left));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    color: #f8fafc;
    background: #0f172a;
    border-top: 1px solid rgba(148, 163, 184, 0.35);
    box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.24);
    font: 400 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .abhihub-consent-content {
    min-width: 0;
    max-width: 760px;
  }

  .abhihub-consent-content strong {
    display: block;
    margin-bottom: 3px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
  }

  .abhihub-consent-content p {
    margin: 0;
    color: #cbd5e1;
  }

  .abhihub-consent-content a {
    color: #bfdbfe;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .abhihub-consent-actions {
    display: flex;
    flex: 0 0 auto;
    gap: 10px;
  }

  .abhihub-consent-btn {
    min-height: 44px;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    white-space: nowrap;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  .abhihub-consent-btn:hover {
    transform: translateY(-1px);
  }

  .abhihub-consent-btn:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
  }

  .abhihub-consent-btn--accept {
    color: #fff;
    background: #2563eb;
  }

  .abhihub-consent-btn--accept:hover {
    background: #1d4ed8;
  }

  .abhihub-consent-btn--decline {
    color: #e2e8f0;
    background: transparent;
    border-color: #64748b;
  }

  .abhihub-consent-btn--decline:hover {
    background: #1e293b;
    border-color: #94a3b8;
  }

  @media (max-width: 640px) {
    .abhihub-consent-banner {
      left: 12px;
      right: 12px;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 16px;
    }

    .abhihub-consent-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
    }

    .abhihub-consent-btn {
      width: 100%;
      padding-inline: 10px;
    }
  }

  @media (max-width: 360px) {
    .abhihub-consent-actions {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .abhihub-consent-btn {
      transition: none;
    }

    .abhihub-consent-btn:hover {
      transform: none;
    }
  }
</style>
<script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
<script src="{{ url_for('static', filename='js/analytics-helper.js') }}" defer></script>
