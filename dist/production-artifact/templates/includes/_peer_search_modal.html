<!-- Peer Search & Material Sharing Modal -->
<div id="peerSearchModal" class="peer-modal-overlay" style="display:none;">
  <div class="peer-modal-card">
    <button class="peer-modal-close" type="button" data-action="closePeerSearchModal" aria-label="Close">&times;</button>
    
    <div class="peer-modal-header">
      <h3>🔍 Search Students & Peer Study Stuffs</h3>
      <p>Find classmates, see what resources they refer to, or request study notes!</p>
      
      <div class="peer-search-input-wrap">
        <label for="peerSearchQuery" class="sr-only">Search students</label>
        <input type="text" id="peerSearchQuery" placeholder="Search student by name or email…" data-event-input="debouncePeerSearch">
        <button class="peer-search-btn" type="button" data-action="executePeerSearch">Search</button>
      </div>
    </div>

    <!-- Results / Peer Content Area -->
    <div class="peer-modal-body">
      <div id="peerSearchResults" class="peer-results-grid"></div>

      <!-- Selected Peer Drawer -->
      <div id="peerDetailView" style="display:none;" class="peer-detail-panel">
        <button class="peer-back-btn" type="button" data-action="backToPeerResults">← Back to Search</button>
        <div id="peerProfileHeader" class="peer-profile-header"></div>
        
        <div class="peer-tabs">
          <button class="peer-tab-btn active" type="button" data-action="switchPeerTab" data-tab="uploads">Uploaded Stuffs (<span id="peerUploadsCount">0</span>)</button>
          <button class="peer-tab-btn" type="button" data-action="switchPeerTab" data-tab="referred">Referred / Studied (<span id="peerReferredCount">0</span>)</button>
          <button class="peer-tab-btn request" type="button" data-action="switchPeerTab" data-tab="request">✉️ Ask for Notes</button>
        </div>

        <div id="peerTabUploads" class="peer-tab-content active"></div>
        <div id="peerTabReferred" class="peer-tab-content" style="display:none;"></div>
        <div id="peerTabRequest" class="peer-tab-content" style="display:none;">
          <div class="peer-request-form">
            <h4>Ask <span id="peerRequestTargetName">Student</span> for Study Notes / Papers</h4>
            <label for="peerReqSubject" class="sr-only">Subject Name</label>
            <input type="text" id="peerReqSubject" placeholder="Subject Name (e.g. Data Structures)" />
            <label for="peerReqDetails" class="sr-only">Details</label>
            <textarea id="peerReqDetails" rows="3" placeholder="What specific unit, PYQ year, or notes do you need?"></textarea>
            <button type="button" data-action="submitMaterialRequest" class="peer-submit-req-btn">Send Request 🚀</button>
            <div id="peerReqStatus" class="peer-req-status"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.peer-modal-overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(8px); z-index: 99999; display: flex;
  align-items: center; justify-content: center; padding: 1rem;
}
.peer-modal-card {
  background: var(--surface);
  width: min(100%, 680px); max-height: 85vh;
  border-radius: 24px; padding: 1.5rem; position: relative;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 25px 60px rgba(0,0,0,0.3);
}
.peer-modal-close {
  position: absolute; top: 1rem; right: 1.2rem; background: none; border: none;
  font-size: 1.8rem; cursor: pointer; color: var(--text-tertiary);
}
.peer-modal-header h3 { margin: 0 0 0.25rem; font-size: 1.3rem; color: var(--gray-800); }
.peer-modal-header p { margin: 0 0 1rem; font-size: 0.88rem; color: var(--text-tertiary); }
.peer-search-input-wrap { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.peer-search-input-wrap input {
  flex: 1; padding: 0.65rem 1rem; border-radius: 12px; border: 1.5px solid var(--border-medium); font-size: 0.95rem;
}
.peer-search-btn {
  background: var(--primary-600); color: white; border: none; padding: 0.65rem 1.2rem;
  border-radius: 12px; font-weight: 700; cursor: pointer;
}
.peer-modal-body { overflow-y: auto; flex: 1; padding-right: 0.2rem; }
.peer-results-grid { display: flex; flex-direction: column; gap: 0.6rem; }
.peer-user-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.85rem 1rem; background: var(--gray-100); border: 1px solid var(--border-light);
  border-radius: 14px; cursor: pointer; transition: all 0.2s;
}
.peer-user-card:hover { border-color: var(--primary-600); background: var(--primary-100); }
.peer-user-info h5 { margin: 0 0 0.2rem; font-size: 0.98rem; color: var(--gray-800); }
.peer-user-info p { margin: 0; font-size: 0.8rem; color: var(--text-tertiary); }
.peer-view-btn { background: var(--primary-600); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; }

/* Detail Panel */
.peer-back-btn { background: none; border: none; color: var(--primary-600); font-weight: 700; cursor: pointer; margin-bottom: 0.5rem; }
.peer-profile-header { background: var(--gradient-primary); color: white; padding: 1rem; border-radius: 14px; margin-bottom: 1rem; }
.peer-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 2px solid var(--border-light); padding-bottom: 0.4rem; }
.peer-tab-btn { background: none; border: none; padding: 0.4rem 0.8rem; font-weight: 700; color: var(--text-tertiary); cursor: pointer; border-radius: 8px; }
.peer-tab-btn.active { background: var(--primary-100); color: var(--primary-800); }
.peer-tab-btn.request { color: var(--accent-pink); }
.peer-item-card { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.8rem; border: 1px solid var(--border-light); border-radius: 10px; margin-bottom: 0.4rem; font-size: 0.88rem; }
.peer-request-form input, .peer-request-form textarea { width: 100%; padding: 0.6rem; margin-bottom: 0.6rem; border-radius: 8px; border: 1px solid var(--border-medium); box-sizing: border-box; }
.peer-submit-req-btn { background: var(--accent-pink); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; }
.peer-req-status { margin-top: 0.5rem; font-weight: 600; color: var(--text-secondary); }
</style>

<script>
let activePeerId = null;
let peerSearchTimer = null;

function openPeerSearchModal() {
  document.getElementById('peerSearchModal').style.display = 'flex';
  document.getElementById('peerSearchQuery').focus();
}

function closePeerSearchModal() {
  document.getElementById('peerSearchModal').style.display = 'none';
}

// Open peer modal to their detail view (materials) — called from suggested peers
function viewPeerMaterialsModal(el) {
  const peerId = (el && el.getAttribute) ? el.getAttribute('data-peer-id') : el;
  if (!peerId) return;
  // If the full peer search modal exists on the page, open it in detail view
  if (document.getElementById('peerSearchModal')) {
    document.getElementById('peerSearchModal').style.display = 'flex';
    document.getElementById('peerSearchResults').style.display = 'none';
    document.getElementById('peerDetailView').style.display = 'block';
    if (typeof viewPeerDetail === 'function') viewPeerDetail(peerId);
  } else {
    // Fallback: just start a chat with this peer (materials button acts as quick chat)
    if (typeof startChatWith === 'function') startChatWith(peerId);
  }
}

function debouncePeerSearch() {
  clearTimeout(peerSearchTimer);
  peerSearchTimer = setTimeout(executePeerSearch, 300);
}

async function executePeerSearch() {
  const q = document.getElementById('peerSearchQuery').value.trim();
  const container = document.getElementById('peerSearchResults');
  if (!q) {
    container.innerHTML = '<p class="peer-no-results">Type a student name to search...</p>';
    return;
  }
  
  container.innerHTML = '<p class="peer-no-results">Searching students...</p>';
  try {
    const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if (!data.success || !data.users || data.users.length === 0) {
      container.innerHTML = '<p class="peer-no-results">No students found.</p>';
      return;
    }
    
    container.innerHTML = data.users.map(u => `
      <div class="peer-user-card" data-action="viewPeerDetail" data-user-id="${u.id}">
        <div class="peer-user-info">
          <h5>${u.name} ${u.is_verified ? '✔️' : ''}</h5>
          <p>🏫 ${u.college_name || 'Student'} • ⚡ ${u.reputation_score} pts • 📤 ${u.uploads_count} uploads</p>
        </div>
        <button class="peer-view-btn">View Stuffs →</button>
      </div>
    `).join('');
    // Re-attach listeners to dynamically created cards
    setTimeout(attachAll, 0);
  } catch(e) {
    container.innerHTML = '<p class="peer-error">Search error. Try again.</p>';
  }
}

async function viewPeerDetail(userId) {
  activePeerId = userId;
  document.getElementById('peerSearchResults').style.display = 'none';
  document.getElementById('peerDetailView').style.display = 'block';
  
  const header = document.getElementById('peerProfileHeader');
  header.innerHTML = '<p class="peer-loading">Loading profile & materials...</p>';
  
  try {
    const res = await fetch(`/api/user/${userId}/materials`);
    const data = await res.json();
    if (!data.success) return;
    
    const u = data.user;
    header.innerHTML = `
      <h4 class="peer-name">${u.name}</h4>
      <p class="peer-meta">🏫 ${u.college_name || 'Student'} • Rank: ${u.rank_title} • ⚡ ${u.reputation_score} Pts</p>
    `;
    document.getElementById('peerRequestTargetName').innerText = u.name;
    
    // Render Uploads
    document.getElementById('peerUploadsCount').innerText = data.uploads.length;
    const upEl = document.getElementById('peerTabUploads');
    if (data.uploads.length === 0) {
      upEl.innerHTML = '<p class="peer-no-results">No public uploads yet.</p>';
    } else {
      upEl.innerHTML = data.uploads.map(item => `
        <div class="peer-item-card">
          <div><strong>📄 ${item['file-name']}</strong> <br><small class="peer-item-sub">${item.subject} • ${item.type}</small></div>
          <a href="/view_pdf?pdf_name=${encodeURIComponent(item['file-path'])}" target="_blank" class="peer-view-link">View 👁</a>
        </div>
      `).join('');
    }

    // Render Referred
    document.getElementById('peerReferredCount').innerText = data.referred.length;
    const refEl = document.getElementById('peerTabReferred');
    if (data.referred.length === 0) {
      refEl.innerHTML = '<p class="peer-no-results">No recent referred items recorded.</p>';
    } else {
      refEl.innerHTML = data.referred.map(item => `
        <div class="peer-item-card">
          <div><strong>📖 ${item['file-name']}</strong> <br><small class="peer-item-sub">${item.subject} • ${item.type}</small></div>
          <a href="/view_pdf?pdf_name=${encodeURIComponent(item['file-path'])}" target="_blank" class="peer-view-link">View 👁</a>
        </div>
      `).join('');
    }
  } catch(e) {
    header.innerHTML = '<p class="peer-error">Failed to load peer materials.</p>';
  }
}

function backToPeerResults() {
  document.getElementById('peerDetailView').style.display = 'none';
  document.getElementById('peerSearchResults').style.display = 'flex';
}

function switchPeerTab(tabName) {
  document.querySelectorAll('.peer-tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.peer-tab-content').forEach(c => c.style.display = 'none');
  
  if (tabName === 'uploads') {
    document.querySelector('.peer-tab-btn:nth-child(1)').classList.add('active');
    document.getElementById('peerTabUploads').style.display = 'block';
  } else if (tabName === 'referred') {
    document.querySelector('.peer-tab-btn:nth-child(2)').classList.add('active');
    document.getElementById('peerTabReferred').style.display = 'block';
  } else if (tabName === 'request') {
    document.querySelector('.peer-tab-btn.request').classList.add('active');
    document.getElementById('peerTabRequest').style.display = 'block';
  }
}

async function submitMaterialRequest() {
  const subj = document.getElementById('peerReqSubject').value.trim();
  const details = document.getElementById('peerReqDetails').value.trim();
  const statusEl = document.getElementById('peerReqStatus');
  
  if (!subj) {
    statusEl.innerHTML = '<span class="peer-error">Please specify a subject name.</span>';
    return;
  }
  
  statusEl.innerHTML = '<span class="peer-loading">Sending request...</span>';
  try {
    const res = await fetch('/api/request-material', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        target_user_id: activePeerId,
        subject: subj,
        details: details
      })
    });
    const data = await res.json();
    if (data.success) {
      statusEl.innerHTML = `<span class="peer-success">✅ ${data.message}</span>`;
      document.getElementById('peerReqSubject').value = '';
      document.getElementById('peerReqDetails').value = '';
    } else {
      statusEl.innerHTML = `<span class="peer-error">❌ ${data.message}</span>`;
    }
  } catch(e) {
    statusEl.innerHTML = '<span class="peer-error">Failed to submit request.</span>';
  }
}
</script>
