<!-- _hero_landing.html - Hero section for landing page -->
<!-- Parameters:
     - paper_count: Number of papers
     - notes_count: Number of notes
-->

<div class="hero-section">
  <div class="hero-bg-blob"></div>
  <div class="hero-bg-blob"></div>

  <div class="hero-badge">
    <span>✨</span> New: Premium Mobile Experience
  </div>

  <h1 class="hero-title">
    Master Your Engineering<br>
    <span>Exams with AbhiHub</span>
  </h1>

  <p class="hero-subtitle">
    The ultimate platform for engineering students. Access verified notes, previous year papers, and practical files
    instantly.
  </p>

  <div class="hero-actions">
    <a href="{{ url_for('upload') }}" class="btn btn-primary">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
      </svg>
      Upload File
    </a>
    <a href="{{ url_for('store_room') }}" class="btn btn-glass">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      Explore Files
    </a>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value">{{ paper_count }}+</div>
      <div class="stat-label">Papers</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">{{ notes_count }}+</div>
      <div class="stat-label">Notes</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">500+</div>
      <div class="stat-label">Students</div>
    </div>
  </div>
</div>
