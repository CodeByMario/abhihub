name: Auto-Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  status:
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check auto-merge eligibility
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request?.number || context.payload.number
            });

            const prNumber = pr.data.number;
            const title = pr.data.title;
            const body = pr.data.body || '';
            const author = pr.data.user.login;
            const draft = pr.data.draft;
            const labels = pr.data.labels.map(l => l.name);

            console.log(`Checking PR #${prNumber}: ${title}`);

            // Skip draft PRs
            if (draft) {
              console.log('Skipping: PR is a draft');
              return;
            }

            // Skip if has do-not-merge or wip label
            if (labels.includes('do-not-merge') || labels.includes('wip')) {
              console.log('Skipping: has do-not-merge or wip label');
              return;
            }

            // Check CI status
            const sha = pr.data.head.sha;
            const status = await github.rest.repos.getCombinedStatusForCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });

            if (status.data.state !== 'success') {
              console.log(`Skipping: CI status is '${status.data.state}', not 'success'`);
              return;
            }

            // Check for approved reviews
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const approved = reviews.data.some(r => r.state === 'APPROVED');
            if (!approved) {
              console.log('Skipping: no approved reviews');
              return;
            }

            // Check changed files for protected paths
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const protectedPaths = [
              'package.json', 'package-lock.json', 'requirements.txt',
              'Pipfile', 'Pipfile.lock', 'Cargo.toml', 'Cargo.lock',
              'go.mod', 'go.sum', 'pom.xml', 'build.gradle'
            ];

            const changedFiles = files.data.map(f => f.filename);
            const hasProtected = changedFiles.some(f => protectedPaths.includes(f));
            if (hasProtected) {
              console.log('Skipping: changes to protected files');
              return;
            }

            // Check PR size
            const totalChanges = files.data.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            if (totalChanges > 500) {
              console.log(`Skipping: PR too large (${totalChanges} lines)`);
              return;
            }

            // All checks passed — merge!
            console.log('✅ All checks passed — merging PR');

            const commitTitle = `${title} (#${prNumber})`;
            const commitMessage = `Auto-merged by GitHub Automation Bot\n\n${body || ''}`;

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              commit_title: commitTitle,
              commit_message: commitMessage,
              merge_method: 'squash'
            });

            console.log(`✅ PR #${prNumber} merged successfully!`);
